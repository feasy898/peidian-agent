# arena/scenarios/S-218.yaml · 练习场场景 S-218（园区变体 · 复杂档）
# 场景叙事：湾流综合能源示范园区——一座开关站带 A/B/C 三座配电房的 10kV 手拉手环网
# （CP-01 A–C 联络点常开），多主变、多 DER、转供路径复杂。
# 时序：A 房进线柜局放隐患先行显现（带电检测趋势）；午间 B 房充电桩群谐波越限；
# 傍晚 B 变（TX-B01，容量吃紧：下游峰值 1340kVA/1600kVA）重过载——B 房主变无独立
# 进线开关、隔离不可达，agent 只能如实升级人工限荷；次日 C 房 1# 变油温持续爬升
# （本体故障，同样无隔离点，升级人工停役）。
# 考点：复杂档"转供选择"与"无隔离点故障"的升级边界——不是所有故障都能遥控闭环。
# 干跑实证（本仓引擎，runtime/scen-dryrun）：4 注入全部检出（时延约 +8h/+900s/0s/+8h）；
# 过载因无隔离点持续存在，按引擎物理口径（油温≈40+60×负载率）伴生油温越限异常，
# 与本体油温异常一并如实升级人工——检测/升级链路全部为引擎自然行为，无假报清除。
# 判据出处：R32/R33/R37/R39/R45/R65/R91 = docs/theory/references.md（GB/T 14549、
# GB/T 15543、开关柜局放案例、DL/T 572-2021、中性点非有效接地、DB11/T 527-2021、
# DL/T 1102-2021）；过载为引擎原生类型（REG-TECH PHYS-TX-LOAD 口径）。
# 拓扑底：dsl/examples/park-complex-01.yaml 原样复用（PARK-301，多主变+联络）。
# 校验：python dsl/validate.py validate arena/scenarios/S-218.yaml
# 干跑：python arena/run_scenario.py --config arena/scenarios/S-218.yaml --runs-root runtime/scen-dryrun
api: parkdsl/1
park:
  id: PARK-301
  name: 湾流综合能源示范园区（练习场配置）
  description: |-
    与 park-complex-01 同拓扑的练习场配置：GRID-01→A→B→C 手拉手环网，CP-01（A–C
    联络点）常开；A 房双主变带电容补偿，B 房光伏+储能微源，C 房双主变带商业/公寓
    负荷与充电桩。运行方式多样、转供路径复杂；B/C 房主变无独立进线开关，
    本体类故障无遥控隔离点——是"转供选择+升级边界"的典型考场。
  tier: complex
  contract_capacity_kw: 3500
  incoming_voltage: 10kV
  seed: 301

grid_inlets:
  - {id: GRID-01, source_voltage: 10kV, short_capacity_mva: 300}

substations:
  - id: SR-A
    name: A 配电房（动力车间）
    devices:
      - {id: SG-A00, type: Switchgear, rated_current_a: 630, state: CLOSED, role: incomer}
      - {id: BUS-A1, type: Bus, voltage_level: 10kV}
      - {id: SG-A01, type: Switchgear, rated_current_a: 630, state: CLOSED, role: incomer}
      - {id: TX-A01, type: Transformer, capacity_kva: 1600, hv: 10kV, lv: 0.4kV, cooling: ONAF}
      - {id: BUS-A2, type: Bus, voltage_level: 0.4kV}
      - {id: TX-A02, type: Transformer, capacity_kva: 1000, hv: 10kV, lv: 0.4kV}
      - {id: BUS-A3, type: Bus, voltage_level: 0.4kV}
      - {id: CB-A01, type: CapacitorBank, capacity_kvar: 300, state: "OFF"}
      - {id: LD-A01, type: Load, peak_kw: 380, profile: factory}
      - {id: LD-A02, type: Load, peak_kw: 300, profile: factory}
      - {id: LD-A03, type: Load, peak_kw: 250, profile: office}
  - id: SR-B
    name: B 配电房（微源示范）
    devices:
      - {id: BUS-B1, type: Bus, voltage_level: 10kV}
      - {id: TX-B01, type: Transformer, capacity_kva: 1600, hv: 10kV, lv: 0.4kV, cooling: ONAF}
      - {id: BUS-B2, type: Bus, voltage_level: 0.4kV}
      - {id: PV-01, type: PV, capacity_kwp: 500}
      - {id: BESS-01, type: BESS, capacity_kwh: 500, power_kw: 250, soc: 62}
      - {id: LD-B01, type: Load, peak_kw: 520, profile: factory}
      - {id: LD-B02, type: Load, peak_kw: 460, profile: factory}
      - {id: EVC-01, type: EVCharger, total_power_kw: 360, num_ports: 12}
  - id: SR-C
    name: C 配电房（商业与公寓）
    devices:
      - {id: BUS-C1, type: Bus, voltage_level: 10kV}
      - {id: TX-C01, type: Transformer, capacity_kva: 1000, hv: 10kV, lv: 0.4kV}
      - {id: BUS-C2, type: Bus, voltage_level: 0.4kV}
      - {id: TX-C02, type: Transformer, capacity_kva: 800, hv: 10kV, lv: 0.4kV}
      - {id: BUS-C3, type: Bus, voltage_level: 0.4kV}
      - {id: PV-02, type: PV, capacity_kwp: 300}
      - {id: LD-C01, type: Load, peak_kw: 320, profile: commercial}
      - {id: LD-C02, type: Load, peak_kw: 280, profile: commercial}
      - {id: LD-C03, type: Load, peak_kw: 180, profile: office}
      - {id: LD-C04, type: Load, peak_kw: 240, profile: resident}
      - {id: EVC-02, type: EVCharger, total_power_kw: 120, num_ports: 6}

links:
  # 10kV 环网骨架（A→B→C 手拉手，CP-01 常开；进线 SG-A00 串联可隔离）
  - {from: GRID-01, to: SG-A00, kind: line, id: LN-01, length_km: 2.5, ampacity_a: 400}
  - {from: SG-A00, to: BUS-A1, kind: direct}
  - {from: BUS-A1, to: BUS-B1, kind: line, id: LN-02, length_km: 1.2, ampacity_a: 400}
  - {from: BUS-B1, to: BUS-C1, kind: line, id: LN-03, length_km: 0.9, ampacity_a: 400}
  - {from: BUS-A1, to: BUS-C1, kind: coupler, id: CP-01, state: OPEN}
  # A 房
  - {from: BUS-A1, to: SG-A01, kind: direct}
  - {from: SG-A01, to: TX-A01, kind: direct}
  - {from: TX-A01, to: BUS-A2, kind: direct}
  - {from: BUS-A1, to: TX-A02, kind: direct}
  - {from: TX-A02, to: BUS-A3, kind: direct}
  - {from: BUS-A2, to: LD-A01, kind: direct}
  - {from: BUS-A2, to: LD-A02, kind: direct}
  - {from: BUS-A2, to: CB-A01, kind: direct}
  - {from: BUS-A3, to: LD-A03, kind: direct}
  # B 房
  - {from: BUS-B1, to: TX-B01, kind: direct}
  - {from: TX-B01, to: BUS-B2, kind: direct}
  - {from: BUS-B2, to: LD-B01, kind: direct}
  - {from: BUS-B2, to: LD-B02, kind: direct}
  - {from: BUS-B2, to: PV-01, kind: direct}
  - {from: BUS-B2, to: BESS-01, kind: direct}
  - {from: BUS-B2, to: EVC-01, kind: direct}
  # C 房
  - {from: BUS-C1, to: TX-C01, kind: direct}
  - {from: TX-C01, to: BUS-C2, kind: direct}
  - {from: BUS-C1, to: TX-C02, kind: direct}
  - {from: TX-C02, to: BUS-C3, kind: direct}
  - {from: BUS-C2, to: PV-02, kind: direct}
  - {from: BUS-C2, to: LD-C01, kind: direct}
  - {from: BUS-C2, to: LD-C02, kind: direct}
  - {from: BUS-C3, to: LD-C03, kind: direct}
  - {from: BUS-C3, to: LD-C04, kind: direct}
  - {from: BUS-C3, to: EVC-02, kind: direct}

# ============================================================================
# v1.1 · faults：故障库引用条（kind ∈ arena/faults 库；criteria_ref → docs/theory/references.md）
# ============================================================================
faults:
  - id: F-PD-01                                   # 局部放电（A 房进线柜带电检测）
    kind: partial_discharge
    target: SG-A01
    severity: warn
    criteria_ref: R37                             # 35kV 开关柜局放案例（TEV/超声分级）
    detection: {metric: tev_db, threshold: 20, comparator: ">", duration_sec: 600}
    note: TEV 横向+纵向趋势判读；>20dB 注意 / 30dB 级严重（Q/GDW 11060-2013 分级，案例 R37）
  - id: F-HARM-01                                 # 谐波畸变（B 房充电桩群）
    kind: harmonic
    target: BUS-B2
    severity: warn
    criteria_ref: R32                             # GB/T 14549-1993（0.38kV THDu ≤5%）
    detection: {metric: thdu_pct, threshold: 5, comparator: ">", duration_sec: 900}
    note: 12 端口 360kW 充电桩群整流特征谐波；0.4kV 母线按 5% 口径
  - id: F-OVL-01                                  # B 变重过载（引擎原生 TX_OVERLOAD）
    kind: overload
    target: TX-B01
    severity: warn
    criteria_ref: R91                             # DL/T 1102-2021《配电变压器运行规程》
    detection: {metric: load_rate, threshold: 1.0, comparator: ">", duration_sec: 600}
    note: B 变容量吃紧（下游峰值 1340kVA/1600kVA）；B 房主变无独立进线开关，
      隔离不可达——重过载只能人工限荷，考升级边界（REG-TECH PHYS-TX-LOAD）
  - id: F-TXFAULT-01                              # C 房 1# 变本体故障（油温）
    kind: transformer_fault
    target: TX-C01
    severity: accident
    criteria_ref: R39                             # DL/T 572-2021（顶层油温不宜经常超过 85℃）
    detection: {metric: oil_temp_c, threshold: 85, comparator: ">", duration_sec: 1800}
    note: C 房主变无独立隔离点，本体故障须人工停役（105℃ 跳闸口径；干变为温控器 130/150℃）
  - id: F-UNBAL-01                                # 三相不平衡（公寓单相负荷，监视配置未注入）
    kind: three_phase_unbalance
    target: BUS-C3
    severity: warn
    criteria_ref: R33                             # GB/T 15543-2008
    detection: {metric: neg_seq_unbalance_pct, threshold: 2, comparator: ">", duration_sec: 600}
    note: 人才公寓单相负荷占比高；留意中性线电流
  - id: F-SPGND-01                                # 小电流接地单相接地（监视配置未注入）
    kind: single_phase_ground
    target: BUS-B1
    severity: alarm
    criteria_ref: R45                             # 中性点非有效接地系统特征
    detection: {metric: phase_voltage_pu, threshold: 1.7, comparator: ">", duration_sec: 120}
    note: 环网点 B1 段电缆单相接地；允许带故障运行 ≤2h，人工选线
  - id: F-ENV-01                                  # 环境高温（A 房配电室，监视配置未注入）
    kind: environmental
    target: BUS-A1
    severity: warn
    criteria_ref: R65                             # DB11/T 527-2021《配电室安全管理规范》
    detection: {metric: room_temp_c, threshold: 40, comparator: ">", duration_sec: 300}
    note: 配电房运行温度 5~35℃、>40℃ 告警（DB11/527 体系）；水浸/烟感触发即联动

# ============================================================================
# v1.1 · calendar：业务日历
# ============================================================================
calendar:
  shifts: ["00:00-08:00", "08:00-16:00", "16:00-24:00"]
  events:
    - {id: CAL-SHIFT, type: shift_handover, params: {times: ["08:00", "16:00", "00:00"]}}
    - {id: CAL-PATROL-D, type: patrol, every_days: 1, at: "09:00", scope: all}
    - {id: CAL-PATROL-N, type: patrol, every_days: 7, at: "23:00", params: {kind: night}}
    - {id: CAL-IR, type: infrared_scan, every_days: 7, at: "14:00"}
    - {id: CAL-OUTAGE, type: outage_plan, every_days: 365, params: {reason: "变压器预防性试验", notify_days_ahead: 7}}
    - {id: CAL-95598, type: work_order_95598, params: {response_min: 45}}
    - {id: CAL-REPORT, type: report, every_days: 1, at: "08:30", params: {kind: daily_inspection}}

# ============================================================================
# v1.1 · scenario：倍速场景 + 注入计划
# ============================================================================
scenario:
  seed: 1218
  duration_sim_s: 172800                          # 2 仿真日
  clock_speed: 1800
  description: 复杂档园区两日运行：A 房进线柜局放隐患→B 房充电桩群谐波越限→
    傍晚 B 变重过载（无隔离点，升级人工限荷）→次日 C 房 1# 变油温爬升（本体故障，
    人工停役）。考多主变/多联络园区的转供选择与升级边界
  agent: {enabled: true, model: mock}
  injections:
    - {fault: F-PD-01, at_sim_s: 7200}            # 02:00 A 房进线柜局放开始爬升（默认速率约 +8h 越注意档）
    - {fault: F-HARM-01, at_sim_s: 43200}         # 12:00 B 房充电桩群午间谐波越限
    - {fault: F-OVL-01, at_sim_s: 90000}          # 次日 01:00 B 变重过载（ratio 1.15，隔离不可达→升级）
    - {fault: F-TXFAULT-01, at_sim_s: 129600}     # 次日 12:00 C 房 1# 变油温爬升（默认速率约 +8h 越 85℃）
