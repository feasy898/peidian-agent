# arena/faults/phase_loss.yaml · 缺相（三相回路断相运行）
# 判据底座：相电流差 15%~20% 告警线=工程惯例（未定位标准数值条文）；断相/堵转保护配置依据
#           GB 50055-2011 §2.3.10/§2.3.7（2026-10-02 经 zoboet.com 全文镜像页实测打开核验）；
#           docs/theory/equipment.md §2.1（园区架构）/ §2.3（热机理）
# 引擎绑定：FAULT_TYPES 含 PHASE_LOSS（fault/dsl.py:27-31）；兼容元件 load+line（fault/dsl.py:48）；
#           遥测信号 phase_current_dev_pct 注入后阶跃置值（fault/telemetry.py:195-196）
kind: phase_loss
title: 缺相（三相回路断相运行）
class: topology                     # 隔离型：一相熔断/断线属物理缺陷，隔离缺相回路即消除危害与信号，修复后方可复电
engine_type: PHASE_LOSS
compat_kinds: [load, line]
params:
  current_dev_pct: {default: 25, min: 0, max: 100}    # 注入的相电流偏差 %（取值域与 fault/dsl.py:121 一致）
  repair_s: {default: 14400, min: 60, max: 2592000}   # 更换熔断器/接续导线消缺时长（仿真秒，上限与 fault/dsl.py:122 一致）
detection:                          # 诚实检测：检测器只读遥测 phase_current_dev_pct + 本判据，不读注入计划
  metric: phase_current_dev_pct
  comparator: ">"
  threshold: 15                     # 相电流差告警线下限（惯例区间 15%~20%，取 15% 从严）
  duration_sec: 60                  # 缺相演化快，持续 1min 即报，防投切冲击误报
  source: "相电流差 >15%~20% 告警为工程惯例，未定位到统一标准数值条文，各家整定不一【工程惯例】；电动机应装断相/堵转保护的配置依据为 GB 50055-2011《通用用电设备配电设计规范》第 2.3.10 条（熔断器保护的连续运行三相电动机应装设断相保护，低压断路器保护宜装）、第 2.3.7 条（运行中可能堵转时应装堵转过载保护）——2026-10-02 经 zoboet.com 全文镜像页实测打开核验，官方文本未直接读取"
mechanism: |-
  一相熔断器熔断、导线断线或触头未合好使三相回路转入缺相运行，回路电流严重不对称并出现负序分量。三相异步电动机缺相运行时起动转矩归零，带载电机堵转，剩余两相电流显著增大（教材口径约 1.7~2 倍额定，未核标准数值【待核】），绕组迅速过热烧毁——这正是 GB 50055-2011 第 2.3.10 条要求熔断器保护的连续运行电动机装设断相保护、第 2.3.7 条要求装设堵转过载保护的原因。10kV 侧一相断线时，园区 Yyn0 配变缺相运行，低压侧单相用户电压骤降或失压（equipment.md §2.1 架构口径），中性线电流激增过热。缺相与三相不平衡的形态特征区分：不平衡是三相都有值且不对称，缺相是一相电流趋零。处置为立即隔离缺相回路/停运缺相电机，更换熔断器或接续导线消缺后复电；隔离即消除危害与信号，属隔离型故障。
evolution:
  - {stage: 隐患, desc: "熔断器选型偏大/触头氧化/导线接头疲劳，单相回路接触不良，红外测温可见该相端子温升（equipment.md §2.3 红外通道）"}
  - {stage: 异常, desc: "phase_current_dev_pct >15%（相电流差超工程告警线【工程惯例】），负序电流出现"}
  - {stage: 告警, desc: "断相保护/热继电器告警动作（GB 50055-2011 §2.3.10 应装设）；缺相电机电流攀升、嗡鸣异响、转速下降"}
  - {stage: 事故, desc: "电机缺相堵转过流烧毁绕组；低压侧单相用户电压骤降/失压引发投诉；Yyn0 配变缺相运行中性线电流激增过热"}
signals:
  - {metric: phase_current_dev_pct, desc: "相电流偏差（最大相电流差）%——注入后阶跃置值，表征缺相深度，检测主判据（fault/telemetry.py:196）"}
agent_expectations:
  must:
    - "confirm：核对三相电流遥测与断相保护动作信号，区分缺相（一相电流趋零）与三相不平衡（三相都有值且不对称）"
    - "diagnose：沿回路定位断相点（熔断器/导线/触头），排查同回路电机是否已转入缺相运行"
    - "plan：立即停运/隔离缺相回路防止电机烧毁，报修更换熔断器或接续导线，消缺验收后复电"
  must_not:
    - "把缺相当成三相不平衡只做负荷调平而不隔离断相回路"
    - "让电机在缺相状态下继续运转"
    - "未修复断相点就恢复送电或关闭告警（假报清除）"
sources: [R33, R35, R102]           # R33=GB/T 15543-2008 负序/不平衡度框架（equipment.md §6）——支撑 mechanism 负序分量论述
                                    # 与"缺相 vs 三相不平衡"鉴别；R35=GB/T 11022-2020 温升限值、R102=DL/T 664-2016 红外诊断
                                    # ——支撑端子温升/绕组过热证据链（equipment.md §2.3）。15% 相电流差告警线【工程惯例】与
                                    # GB 50055-2011 断相保护配置依据均非 docs/theory R 编号文献，出处仍载于 detection.source，
                                    # 不悬空挂 R 编号
