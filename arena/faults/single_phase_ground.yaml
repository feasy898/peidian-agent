# arena/faults/single_phase_ground.yaml · 小电流接地系统单相接地
# 判据底座：docs/theory/equipment.md §2.6（R43/R44/R45）、§3.5；§2.1（中性点接地方式与电容电流准则）
# 引擎绑定：FAULT_TYPES 含 SINGLE_PHASE_GROUND（fault/dsl.py:31）；兼容元件 bus+line（fault/dsl.py:49）
# 参数规格：fault/dsl.py:124-128（phase_voltage_pu/allowed_s/repair_s）；遥测 phase_voltage_pu
# （fault/telemetry.py:198，取值=注入参数值）、母线 v_pu（fault/telemetry.py:99）
kind: single_phase_ground
title: 单相接地（10kV 小电流接地系统）
class: topology                     # 隔离型：拉开/隔离故障线路即消除告警（信号仅在目标带电时
                                    # 出现，fault/telemetry.py:164；处置=选线+隔离，非消缺）
engine_type: SINGLE_PHASE_GROUND
compat_kinds: [bus, line]           # 与 fault/dsl.py:49 COMPAT_KINDS 一致
params:                             # 与 fault/dsl.py:124-128 PARAM_SPECS 键集一字不差
  phase_voltage_pu: {default: 1.73, min: 1.0, max: 2.0}   # 非故障相对地电压（pu）：
                                    # 1.73≈√3 为金属性接地升至线电压【R45】；高阻接地取 1.0~1.73 之间
  allowed_s: {default: 7200, min: 60, max: 86400}         # 允许带故障运行时间（仿真秒，上限=引擎域 86400，fault/dsl.py:126）：
                                    # 默认 7200=2h——运行规程/教材通行惯例【R44】【工程惯例，条文待核】
  repair_s: {default: 14400, min: 60, max: 2592000}       # 选线+定位+隔离+巡线消缺时长（仿真秒，上限=引擎域 86400*30，fault/dsl.py:127）
detection:                          # 诚实检测：检测器只读遥测 phase_voltage_pu + 本判据，不读注入计划
  metric: phase_voltage_pu
  comparator: ">"
  threshold: 1.15                   # 相电压抬升≥15%：对应零序电压约 15%Un 的常用接地告警量级，
                                    # 可覆盖高阻接地（金属性接地直达 1.73pu）【工程惯例——待核】
  duration_sec: 300                 # 持续 5min 才报，防瞬时电压波动误报（建模防抖参数）
  source: "金属性接地特征：故障相对地 0、两非故障相升至线电压（√3≈1.73 倍相电压）、线电压仍对称
    【R45】；检测阈值 1.15pu 对应'零序电压≈15%Un 告警'的通行整定量级【工程惯例，未见条文——待核】；
    GB/T 14285-2023 规定中性点非有效接地系统的单相接地检测/选线装置配置【R43】【标准条文，条款
    细则待核】；选线装置应耐过渡电阻、300Ω 为文献与技术条件常用验证阈值——未能在 GB/T 14285-2023
    定位该条文（与 equipment.md 待核#7 一致）【R43】【工程惯例——待核】"
mechanism: |-
  10kV 园区配网属中性点非有效接地（不接地或经消弧线圈接地），单相接地时故障电流仅为电容电流，
  三个线电压仍对称，不影响三相用户供电，故系统可短时带故障运行【R45】；接地方式选择的电容电流
  准则：不大于 10A 可采用不接地方式，大于 10A 且需带故障运行时宜采用谐振接地（GB/T 50064-2014）
  【R44】【标准条文，条文号待核】。金属性接地时故障相对地电压降为 0，两个非故障相对地电压升高至
  线电压，即 √3≈1.73 倍相电压【R45】；经过渡电阻接地时非故障相抬升介于 1.0~1.73pu，过渡电阻
  越大稳态零序特征越弱，选线装置应对带过渡电阻的接地故障具备检测能力，300Ω 是文献与装置技术
  条件中常用的检测能力验证阈值——种子将"选线 ≤300Ω"归 GB/T 14285-2023，本卷未能定位该条文，
  暂按工程惯例处理【R43】【待核】。系统带单相接地运行一般不超过 2 小时，期间应尽快选线、定位、
  转移负荷并隔离故障线路；不能长期运行的原因是非故障相绝缘长期承受线电压，易在绝缘薄弱处击穿
  形成第二点接地，发展为相间短路跳闸【R44】【运行规程与教材通行惯例；"2 小时"未定位现行国标
  逐字条文，检索多源一致（含 DL/T 620 旧规归属线索）——待核】。
evolution:
  - {stage: 隐患, desc: "线路/电缆绝缘薄弱点潜伏（外力破坏、树障、污秽、接头受潮）；发现通道：巡视、熄灯巡（放电声光）、带电检测（equipment.md §3.5；operations.md §1）"}
  - {stage: 异常, desc: "单相接地发生：故障相对地电压降为 0（或按过渡电阻部分降低）、非故障相升至最高 √3≈1.73pu、零序电压升高，线电压仍对称、用户不停电【R45】"}
  - {stage: 告警, desc: "母线接地告警（零序电压越限/非故障相抬升越过判据）+选线装置指示嫌疑馈线；处置窗口 ≤2h【R44 惯例待核】——期间须完成选线、定位与倒负荷准备"}
  - {stage: 事故, desc: "超时未隔离：绝缘薄弱点击穿成第二点接地→相间短路跳闸停电，或电压互感器谐振致熔断器熔断；隔离故障线路即消除（topology 类），恢复后须巡线消缺"}
signals:
  - {metric: phase_voltage_pu, desc: "非故障相对地电压（pu，fault/telemetry.py:198）——检测主判据；1.73=金属性接地 √3 倍【R45】"}
  - {metric: v_pu, desc: "母线电压（pu，fault/telemetry.py:99）——单相接地时线电压仍对称（区别于相间短路的电压塌陷），辅助确认故障形态"}
agent_expectations:
  must:
    - "confirm：复核 phase_voltage_pu 与零序告警，结合三相电压形态区分单相接地与 PT 断线/谐振"
    - "diagnose：横向比较各出线零序电流幅值/相位选线，锁定嫌疑馈线（利用接地告警窗口，不盲目逐条试拉）"
    - "plan：在 ≤2h 窗口【R44 惯例】内制定隔离与负荷转移方案，准备操作票（人审）"
    - "isolate：隔离故障线路消除告警（topology 类，拉闸即消除），保住非故障馈线供电"
    - "summary/verify：巡线确认接地点并消缺，复测复归后闭环"
  must_not:
    - "超 2h 窗口仍带故障运行不处置（非故障相绝缘长期承受线电压，R44）"
    - "未选线定位就逐条全线试拉（扩大用户失电扰动）"
    - "假报清除/未巡线确认即宣布恢复"
    - "把'≤2h'当可延长窗口自行放宽（惯例口径，超出即升级人工）"
sources: [R43, R44, R45]
