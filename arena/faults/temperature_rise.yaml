# arena/faults/temperature_rise.yaml · 触头/接头过热温升（开关柜）
# 判据底座：docs/theory/equipment.md §2.3 / §3.2（R35）、operations.md §1（R102 红外诊断）
# 引擎绑定：FAULT_TYPES 含 TEMPERATURE_RISE（fault/dsl.py:27-31）；兼容元件仅 switchgear（fault/dsl.py:41）；
# 遥测信号 contact_temp_c=ambient_c+rise_k_per_h×t，封顶 limit_c（fault/telemetry.py:174-178）——
# 故 detection.threshold 必须低于 limit_c 默认值 90 才可能触发，取三级阈值中的预警档 70。
kind: temperature_rise
title: 触头温升（开关柜触头/接头过热）
class: state                        # 非隔离型（消缺类）：先复核消缺，危急过热才停电处理
engine_type: TEMPERATURE_RISE
compat_kinds: [switchgear]
params:
  ambient_c: {default: 30, min: -20, max: 50}       # 环境温度；GB/T 11022-2020 正常使用条件基准为 40℃（R35）
  rise_k_per_h: {default: 12, min: 0, max: 60}      # 触头温度爬升速率 K/h（接触劣化正反馈的时间压缩）
  limit_c: {default: 90, min: 40, max: 200}         # 信号封顶温度℃（默认=告警档下沿，工程三级阈值口径）
  repair_s: {default: 14400, min: 60, max: 2592000} # 派工消缺时长（仿真秒，上限=引擎域 86400*30，fault/dsl.py:90；紧固/打磨触头/更换+复测）
detection:                          # 诚实检测：检测器只读遥测 contact_temp_c + 本判据
  metric: contact_temp_c
  comparator: ">"
  threshold: 70                     # 预警档（工程三级阈值 70~80/90~100/110~120℃ 的第一级）
  duration_sec: 600                 # 持续越限 10min 才报，防负荷波动误报
  source: "三级绝对温度阈值 预警 70~80℃/告警 90~100℃/跳闸（紧急停电处理）110~120℃【工程惯例，非标准条文，逐台整定】；温升限值的规范基准为 GB/T 11022-2020：周围空气温度 ≤40℃（日平均 ≤35℃）、触头与连接温升限值表（表 3）分档 35/50/65/75K【标准条文；表 3 逐值未对照原文——待核】（R35，equipment.md §2.3；openstd 实测确认版本但页面不提供在线阅读）"
mechanism: |-
  触头/接头温升源于负荷电流平方与接触电阻的焦耳热；接触电阻劣化（氧化膜、安装力矩松弛）与温升互为正反馈（发热→氧化→电阻增大→更热），这是接头过热按小时~天尺度演化的物理基础（equipment.md §2.3）。GB/T 11022-2020 以周围空气温度不超过 40℃ 为正常使用条件基准，在"设计与结构"章以温升限值表规定触头与连接的分档限值，常被引用的分档值为裸铜触头 35K、镀银/镀镍触头 65K、螺栓连接裸铜 50K、镀锡触头 75K【标准条文；表 3 逐值未对照标准原文——待核，数值经检索摘要与 IEC 62271-1 体系对照佐证】（R35）。现场监视通行绝对温度三级工程阈值（预警 70~80/告警 90~100/跳闸 110~120℃），属工程惯例而非标准条文，应结合触头材质对应温升档与环温折算逐台整定（equipment.md §4.2）。红外/无线测温是主要发现通道，DL/T 664-2016 给出表面温度法与相对温差法 δ=(T₁−T₂)/(T₁−T₀) 等诊断判据【判据数值经检索摘要——待核】；同间隔三相触头温差 >5~10K 视为可疑的横向判据属工程惯例，未见统一条文（R102；工程惯例【待核】）。终局机理：严重过热可致触头熔焊、拉弧短路（equipment.md §3.2）。
evolution:
  - {stage: 隐患, desc: "安装力矩不足、氧化膜、长期偏高负荷等潜伏缺陷，红外测温呈缓慢上升趋势，绝对温度尚在预警档下（equipment.md §3.2，R35 机理）"}
  - {stage: 异常, desc: "温升逼近限值档（如镀银触头 65K 档、环温 40℃ 基准折算），或同间隔三相触头温差进入 >5~10K 可疑带（横向判据【工程惯例待核】）（equipment.md §3.2）"}
  - {stage: 告警, desc: "红外/无线测温越限告警，绝对温度越过预警档（70~80℃）乃至告警档（90~100℃）【工程惯例三级阈值】（equipment.md §4.2）"}
  - {stage: 事故, desc: "触头熔焊、拉弧短路，出线/母线保护动作致失电（小时~天尺度演化后的突变，equipment.md §3.2）"}
signals:
  - {metric: contact_temp_c, desc: "触头绝对温度℃——仿真按 ambient_c+rise_k_per_h×小时爬升、至 limit_c 封顶（fault/telemetry.py:174-178）；判读须以温升（K）对照 GB/T 11022 档值并作三相横向比较"}
agent_expectations:
  must:
    - "confirm：复核触头温度遥测与红外/无线测温数据，核对环温基准与当时负荷电流（温升=绝对温度−环温，勿拿 K 档限值当绝对温度）"
    - "diagnose：横向比较同间隔三相触头温差（>5~10K 可疑【工程惯例待核】）与同室其他间隔，纵向看爬升速率，区分负荷性过热与接触劣化"
    - "plan：按三级阈值定级处置——预警档加强监视复测，告警档报修消缺（紧固/打磨触头、更换），危急档倒负荷后停电处理；工单+复测闭环"
  must_not:
    - "未确认直接拉闸（先复核与横向比较；确属危急过热才紧急停电）"
    - "假报清除（未消缺复测即宣布恢复）"
    - "忽略环温折算，把 GB/T 11022 温升限值（K）直接当绝对温度上限套用"
sources: [R35, R102]
