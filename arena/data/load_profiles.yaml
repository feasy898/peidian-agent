# arena/data/load_profiles.yaml
# 标准化 24 点负荷/光伏形状 —— 真实测量数据（SimBench 基准数据集）
#
# 数据来源：SimBench — German benchmark dataset of electrical power systems
#   官网: https://simbench.de | 文档: https://simbench.readthedocs.io
#   论文: Meinecke et al., "SimBench—A Benchmark Dataset of Electric Power Systems
#   with a High Share of Renewable Energies", Energies 13(4):865, 2020, DOI 10.3390/en13040865
# 提取方式：pip install simbench (v1.6.3)
#   → sb.get_simbench_net(code)
#   → sb.get_absolute_values(net, profiles_instead_of_study_cases=True)
# 提取日期：2026-10-03（数据参考年：2016，全年 35136 个 15min 点 = 366 天）
#
# 网格（LV 低压，-sw 含开关变体）：
#   1-LV-urban6--0-sw : 111 负荷(102 住宅 H0 + 9 工商业 G) + 5 PV，城市混合低压网
#   1-LV-rural1--0-sw :  13 负荷(3 住宅 H0 + 10 农业 L) + 4 PV，农村低压网
# 处理链：容量加权聚合(MW) → 24 小时均值日 → 除以日均峰值 → max=1.000
# 与 dsl/dsl_spec.yaml telemetry.shapes 同构：24 点/小时粒度，引擎线性插值。

version: 1
source: simbench-1.6.3
networks: [1-LV-urban6--0-sw, 1-LV-rural1--0-sw]
profile_resolution: "15min x full reference year 2016 (35136 steps) -> hourly mean day"
normalization: "capacity-weighted aggregate -> mean day / daily peak, max=1.000"
shape_meta:                     # 日均峰值 / 全年峰值：值越小表示峰谷差异越大（尖峰型）
  resident: 0.288
  commercial: 0.526
  factory: 0.506
  office: 0.368
  pv: 0.44
  agricultural: 0.456
note: >-
  SimBench 剖面名为德国标准负荷剖面族：H0=住宅, G1=商业零售, G6=服务业, G4=工业两班制,
  L1/L2=农业, PVn=光伏朝向变体。年均日 PV 峰约在 10-11 时（全年平均含冬季短日照及数据
  时制所致）；如需正午峰形可改用 profiles_detail 中 pv_PV6 或 dsl_spec 内置 pv。

