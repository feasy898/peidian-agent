scenario:
  seed: 1222
  duration_sim_s: 172800
  clock_speed: 1800
  description: 模拟台风导致配电房温度升高，考察运维人员对环境类异常的响应和处理能力，需确认故障、采取措施降温并闭环。
  agent: {enabled: true, model: mock}
  injections:
  - fault: F-ENV-001
    at_sim_s: 36000
    params: {mode: high_temp, room_temp_c: 45, repair_s: 7200}
