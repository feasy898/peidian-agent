  case_004:
    advance_minutes: 90
    plan:
      - {at: "+10m", capability: create.switch_order@v1, arguments: {code: SO-0915-101, status: ISSUED, devices: [SG-A02], issuer: OP-003, steps: [{no: 1, op: 确认具备操作条件}, {no: 2, op: 遥控分闸 SG-A02}, {no: 3, op: 检查执行结果}]}}
