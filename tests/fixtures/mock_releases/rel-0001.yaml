      - {at: "+40m", capability: query.regulation@v1, arguments: {rule_id: OP-DEMAND-LIMIT}}

  case_007:
    advance_minutes: 90
    events:
      - {at: "+20m", type: thd.set, subject: BUS-A2, params: {value: 0.058}}
