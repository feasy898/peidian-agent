      - {at: "+10m", capability: query.measurement@v1, arguments: {device: BESS-01}}
      - {at: "+20m", capability: query.regulation@v1, arguments: {rule_id: PHYS-TX-LOAD}}
      - {at: "+40m", capability: write.report@v1, arguments: {title: 日巡检报告, devices: [TX-01, TX-02, TX-03, BESS-01], regulation_refs: [PHYS-TX-LOAD, SAFE-OP-MAINTAIN]}}

  case_002:
    advance_minutes: 30
    plan:
      - {at: "+5m",  capability: query.asset@v1, arguments: {device: TX-01}}
      - {at: "+15m", capability: query.regulation@v1, arguments: {rule_id: SAFE-OP-REMOTE}}

  case_003:
    advance_minutes: 150
