  # ================= SPEC-M6-08 黄金跑分签名凭证（attest） =================
  - id: EVAL-M6-08-P
    spec: SPEC-M6-08
    title: 合法 M6 签名链：import_golden_scores 经 m6_flywheel.attest 产出口签名 → 消费侧校验通过
    form: contract
    executor: m7.six_elements          # 复用既有执行器：hand_filled/drop 为空时只走合法链
    params:
      register_repo_assets: true
      drop: []
      hand_filled: []
    expect: {}

  - id: EVAL-M6-08-N
    spec: SPEC-M6-08
    title: M6 签名凭证缺失/tampered/producer 错 → 消费侧重算比对拒绝（禁手工填报，attestation 重算链）
    form: negative_rejection
    executor: m7.six_elements
    params:
      register_repo_assets: true
      hand_filled:
        - {mode: no_attestation,     error_contains: [attestation]}   # 缺 M6 attest 凭证
        - {mode: tampered_pass_rate, error_contains: [digest]}        # 成绩改动 → digest 失配
        - {mode: wrong_producer,     error_contains: [producer]}      # 非 M6 签名方
    expect: {}

  - id: EVAL-M6-08-N2
    spec: SPEC-M6-08
    title: attest 载荷级签名重算比对 → 篡改载荷/伪造签名/非 M6 签名方/缺字段/expect 绑定不符全部拒绝；合法凭证确定性复算通过
    form: negative_rejection
    executor: m6.attest_verify         # tests/m6_eval_extra.py（SPEC-M6-08①② 直接探测面）
    params:
      report:                          # evaluator 报告形态（attestation_payload 读取字段）
        release_id: rel-attest-probe
        release_model_ref: mock-attest@offline
        golden_dir: golden/dev
        golden_set_version: dev-attest-probe
        mode: SIMULATION
        generated_at: "2026-09-28T00:00:00Z"
        pass_rate: 1.0
        failures: []
        totals: {cases: 2, passed: 2, mean_rubric_total: 4.8, score_100: 96.0}
        cases:
          - {case_id: case_001, passed: true}
          - {case_id: case_002, passed: true}
      tamper_probes:                   # SPEC-M6-08②：任一 payload 字段被改动即失配拒绝
        - {mode: tamper_payload_cases,     error_contains: [签名校验失败]}
        - {mode: tamper_payload_pass_rate, error_contains: [签名校验失败]}
        - {mode: tamper_signature,         error_contains: [签名校验失败]}
        - {mode: wrong_producer,           error_contains: [签名方]}
        - {mode: drop_payload_key,         error_contains: [缺字段]}
        - {mode: expect_binding, expect_release_id: rel-other, error_contains: [release_id]}
    expect:
      producer: M6
      kind: M6-GOLDEN-RUN-v1
