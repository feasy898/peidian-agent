  # ================= SPEC-M6-05 受控自进化 =================
  - id: EVAL-M6-05-P
    spec: SPEC-M6-05
    title: 方法出现 3 次（不同任务实例）判据全过 → skillize 产出 SkillDescriptor 候选
    form: contract
    executor: m6.skillize
    params:
      method_key: method.overload-response
      occurrences:
        - {trace_id: trace-t1, task_id: task-101, judge_passed: true, case_id: case_003}
        - {trace_id: trace-t2, task_id: task-202, judge_passed: true, case_id: case_011}
        - {trace_id: trace-t3, task_id: task-303, judge_passed: true, case_id: case_004}
        - {trace_id: trace-t4, task_id: task-101, judge_passed: true, case_id: case_003}
      skill_draft:
        skill_id: skill.overload-response
        version: 0.1.0
        capability_domain: MAINTAIN
        disclosure:
          level0: 过载响应处置
          level1: 变压器过载研判与处置动作序列（两票/审批/工单）
          level2_ref: skills/overload-response/SKILL.md
        entry: {prompt_ref: prompts/overload-response@v1, checklist: 过载研判清单}
        evidence_policy: 需附环境回读证据
        owner: m6-flywheel
        status: DRAFT
      badcase_id: bc-case_ab_002-0001
      evidence_ref: runtime/experiments/bc-1.json
    expect:
      produced: true
      status: REVIEW

