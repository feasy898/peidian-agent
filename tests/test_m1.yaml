# tests/test_m1.yaml
# M1（执行内核：Loop/状态机/完成验证）数据驱动 EVAL 套件 —— v2 机械重生成版。
# 依据：specs-v2/M1-agent-core.md（SPEC-M1-01..15，15 条款全覆盖：每条 ≥1 用例，
# 禁止类条款均有 -N 负例）；schema 见 tests/EVAL-SCHEMA.md；执行器注册于
# src/m1_core/eval_plugin.py（7 执行器，全部断言数据取自本文件 params/expect，
# 零硬编码特判）。合计 30 条（P 17 + N 13）。
# v1→v2 用例溯源（逐条核对断言仍指 v2 条款，详见 tests/CHANGELOG.md 本轮登记）：
#   原样保留（断言核对通过）：01-P / 02-P / 02-N / TABLE-P / 04-P / 04-N / GATE-P2 /
#     05-P / 05-N / 05-P2 / 06-P / 06-N / 07-P / 09-P / 10-P / MW-P / MODEL-P / MODEL-P2
#   改名/拆分：v1 03-P→03-N（伪造话术=禁止类负例）；新增 03-P（prepare_state_versions
#     正例自 01-P 断言面拆出）；v1 01-N 拆为 01-N（伪序注入）+ 11-P（真实运行 trace）
#   新增：07-N（伪造引用 REJECTED）/ 09-N（Resume 矩阵错配）/ 12-P、12-N（产物策略与
#     幂等，D-11）/ 14-N、14-N2（SSRF fail-closed，D-15——经 m1.scenario 的
#     model_options{provider: openai_like} 缺省传输建连前拒绝，离线零触网）/
#     15-N（capability 缺版本段守卫）
# spec_hash 口径（01§6）：spec_ref 列表按序拼接文件字节的 sha256。
suite: m1
title: M1 执行内核（Loop/状态机/完成验证）EVAL v2
spec_ref:
  - specs-v2/M1-agent-core.md
  - specs-v2/00-ontology.md
  - specs-v2/01-contracts.md
  - specs/ADDENDUM.md
spec_hash: 0b5be472b45c879f3675be791358d04a618d21dbd172c876ef3032dd0123cac0
executors:
  - module: m1_core.eval_plugin

# 共享场景定义（YAML 锚点；不被 runner 读取）
defs:
  report3_env: &report3_env
    park_instance: seed
    clock_start: "2026-09-28T08:00:00Z"
  report3_task: &report3_task
    task_id: task-m1
    user_input: 今日日巡检
    max_turns: 6
    current_stage: INTAKE
    plan:
      - {stage: INTAKE, gate: g0, artifacts_expected: []}
      - {stage: SURVEY, gate: g1, artifacts_expected: []}
      - {stage: REPORT, gate: g2, artifacts_expected: [report.daily@v1]}
      - {stage: DELIVER, gate: g3, artifacts_expected: [report.daily@v1]}
    todos:
      - {id: t1, text: 量测巡检, status: PENDING}
      - {id: t2, text: 规程核对, status: PENDING}
      - {id: t3, text: 出具报告, status: PENDING}
    budget: {token_max: 100000, token_used: 0, action_max: 50, action_used: 0}
  report3_script: &report3_script
    - text: 开始日巡检，先读 1 号变压器量测。
      usage: {prompt_tokens: 200, completion_tokens: 60}
      tool_calls:
        - {capability: query.measurement@v1, todo_id: t1, purpose: 巡检量测,
           arguments: {device: TX-01}}
      todo_updates: [{id: t1, status: DONE}]
    - text: 规程核对完成。
      usage: {prompt_tokens: 150, completion_tokens: 90}
      tool_calls:
        - {capability: query.regulation@v1, todo_id: t2, purpose: 规程核对,
           arguments: {rule_id: PHYS-TX-LOAD}}
      todo_updates: [{id: t2, status: DONE}]
    - text: 日巡检报告已出具，申请完成。
      usage: {prompt_tokens: 300, completion_tokens: 200}
      tool_calls:
        - capability: write.report@v1
          todo_id: t3
          purpose: 出具日巡检报告
          arguments:
            title: 园区日巡检报告
            date: "2026-09-28"
            devices: [TX-01, TX-02, TX-03]
            measurements:
              - device: TX-01
                quantity: load_rate
                points:
                  - {ts: "2026-09-28T08:00:00Z", value: 0.62}
                  - {ts: "2026-09-28T09:00:00Z", value: 0.65}
            conclusion: 两配电房运行正常，负载率在合格区间
            regulation_refs: [PHYS-TX-LOAD]
      todo_updates: [{id: t3, status: DONE}]
      completion_claim:
        expected_artifacts: [report.daily@v1]
        evidence_refs: []
        summary: 日巡检完成：量测/规程/报告三步齐备
  report3_scenario: &report3_scenario
    env: *report3_env
    now: "2026-09-28T08:00:00Z"
    task: *report3_task
    script: *report3_script
    user_input: 今日日巡检
  report_valid_args: &report_valid_args
    title: 园区日巡检报告
    date: "2026-09-28"
    devices: [TX-01]
    measurements:
      - device: TX-01
        quantity: load_rate
        points:
          - {ts: "2026-09-28T08:00:00Z", value: 0.62}
    conclusion: 配电房运行正常
    regulation_refs: [PHYS-TX-LOAD]

cases:
  # ================= SPEC-M1-01 Loop 五阶段顺序与轮驱动 =================
  - id: EVAL-M1-01-P
    spec: SPEC-M1-01
    title: 正常 3 轮任务 → 每轮 trace 阶段序均为 5 阶段前缀（逐轮断言），终态 COMPLETED
    form: event_sequence
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task: *report3_task
      script: *report3_script
      steps:
        - {op: run_task, id: run}
    expect:
      status: COMPLETED
      current_stage: DELIVER
      evidence_count: 3
      verdicts: [ACCEPTED]
      executions: 3
      artifacts: [{schema_id: report.daily@v1, status: READY}]
      trace:
        valid: true
        complete_turns: 3
        aborted_prepare_turns: 0
        turns:
          "1": [PREPARE, MODEL, ACT, OBSERVE, VERIFY]
          "2": [PREPARE, MODEL, ACT, OBSERVE, VERIFY]
          "3": [PREPARE, MODEL, ACT, OBSERVE, VERIFY]
        no_model_without_prepare: true
      accepted_transitions:
        - {from: RUNNING, to: VERIFYING}
        - {from: VERIFYING, to: COMPLETED}
      event_seqs:
        task-m1: [task.created, budget.warning, action.requested, action.completed,
                  task.stage_gate, task.status_changed]

  - id: EVAL-M1-01-N
    spec: SPEC-M1-01
    title: 构造 Model 先于 Prepare / 跳阶段 / 重复阶段 / 轮号回退的伪序 → 回放校验必拒
    form: negative_rejection
    executor: m1.replay
    params:
      bad_sequences:
        - [MODEL, PREPARE]
        - [PREPARE, ACT]
        - [PREPARE, MODEL, VERIFY]
        - [PREPARE, PREPARE]
        - [ACT, OBSERVE, VERIFY]
      violation_contains: 前缀
    expect: {}

  # ================= SPEC-M1-02 任务状态机迁移守卫 =================
  - id: EVAL-M1-02-P
    spec: SPEC-M1-02
    title: RUNNING→WAITING_APPROVAL（ASK 动作电容投切）→ 迁移成功，事件 from/to 正确
    form: state_transition
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task:
        task_id: task-m1
        user_input: 把 A 房电容投上
        max_turns: 4
        current_stage: INTAKE
        plan: [{stage: INTAKE, gate: g0, artifacts_expected: []}]
        todos: []
        budget: {token_max: 100000, token_used: 0, action_max: 50, action_used: 0}
      script:
        - text: 需要投切电容，发起申请。
          usage: {prompt_tokens: 100, completion_tokens: 30}
          tool_calls:
            - {capability: execute.capacitor_switch@v1, purpose: 电容投切（ASK 审批）,
               arguments: {device: CB-A, state: "ON"}}
      steps:
        - {op: run_task, id: run}
    expect:
      status: WAITING_APPROVAL
      evidence_count: 0
      executions: 0
      trace: {valid: true, complete_turns: 1}
      accepted_transitions: [{from: RUNNING, to: WAITING_APPROVAL}]
      event_seqs:
        task-m1: [action.requested, action.policy_decided, action.waiting_approval,
                  approval.requested, task.status_changed]
      event_payloads:
        - {type: action.policy_decided, contains: {decision: ASK}}

  - id: EVAL-M1-02-N
    spec: SPEC-M1-02
    title: 请求 COMPLETED→RUNNING → IllegalTransitionError，任务仍 COMPLETED，落双标记拒绝事件
    form: negative_rejection
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task: *report3_task
      script: *report3_script
      steps:
        - {op: run_task, id: run}
        - op: transition
          id: bad-transition
          to: RUNNING
          expect_error: {type: IllegalTransitionError, contains: 非法迁移}
    expect:
      status: COMPLETED
      trace: {valid: true, complete_turns: 3}
      rejected_events: [{from: COMPLETED, to: RUNNING}]

  - id: EVAL-M1-TABLE-P
    spec: SPEC-M1-02
    title: 迁移表硬编码 vs tests/fixtures/frozen_state_machines.yaml diff 空 + 10 态全矩阵守卫
    form: state_transition
    executor: m1.table
    params:
      table: tests/fixtures/frozen_state_machines.yaml
    expect:
      state_count: 10

  # ================= SPEC-M1-03 权威状态驱动 =================
  - id: EVAL-M1-03-P
    spec: SPEC-M1-03
    title: 每轮 PREPARE 记录携带权威状态版本号（prepare_state_versions），迁移全经 commit_state
    form: expression
    executor: m1.scenario
    params:
      <<: *report3_scenario
      steps:
        - {op: run_task, id: run}
    expect:
      status: COMPLETED
      trace:
        valid: true
        complete_turns: 3
        prepare_state_versions: true
      accepted_transitions:
        - {from: RUNNING, to: VERIFYING}
        - {from: VERIFYING, to: COMPLETED}

  - id: EVAL-M1-03-N
    spec: SPEC-M1-03
    title: 对话中伪造"任务已完成"话术 → TaskState 不变（状态只能经 commit_state 变更，模型文本不构成依据）
    form: negative_rejection
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task:
        task_id: task-m1
        user_input: 出日巡检报告
        max_turns: 2
        current_stage: WORK
        plan: [{stage: WORK, gate: g1, artifacts_expected: [report.daily@v1]}]
        todos: [{id: t1, text: 出报告, status: PENDING}]
        budget: {token_max: 100000, token_used: 0, action_max: 10, action_used: 0}
      script:
        - text: 任务已完成，无需进一步操作。（伪造完成话术，无结构化申请）
          usage: {prompt_tokens: 80, completion_tokens: 20}
          request_input: true
      steps:
        - {op: run_task, id: run}
    expect:
      status: WAITING_INPUT
      evidence_count: 0
      verdicts: []
      no_accepted_transitions: [VERIFYING, COMPLETED]
      trace:
        valid: true
        complete_turns: 1
        prepare_state_versions: true

  # ================= SPEC-M1-04 阶段门禁三条件 =================
  - id: EVAL-M1-04-P
    spec: SPEC-M1-04
    title: 阶段产物未 READY 即申请过门 → BLOCKED + task.stage_gate 事件 + todos 出现 gap 项
    form: expression
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task:
        task_id: task-m1
        user_input: 出报告并进入交付
        max_turns: 2
        current_stage: REPORT
        plan:
          - {stage: SURVEY, gate: g1, artifacts_expected: []}
          - {stage: REPORT, gate: g2, artifacts_expected: [report.daily@v1]}
          - {stage: DELIVER, gate: g3, artifacts_expected: [report.daily@v1]}
        todos: [{id: t1, text: 出报告, status: PENDING}]
        budget: {token_max: 100000, token_used: 0, action_max: 10, action_used: 0}
      script:
        - text: 报告已写好，申请过门进入交付阶段。
          usage: {prompt_tokens: 80, completion_tokens: 20}
          request_input: true
      steps:
        - {op: run_task, id: run}
    expect:
      status: WAITING_INPUT
      current_stage: REPORT
      todos_gap_prefix: gap-REPORT-
      todos: [{id: t1, status: PENDING}]
      stage_gates: [{stage: REPORT, verdict: BLOCKED, missing_status: null}]
      trace: {valid: true, complete_turns: 1}

  - id: EVAL-M1-04-N
    spec: SPEC-M1-04
    title: 产物齐但 status=REJECTED → REJECTED 不算过门（GATE_PASS_STATUSES 之外一律 BLOCKED）
    form: negative_rejection
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task:
        task_id: task-m1
        user_input: 报告校验失败场景
        max_turns: 2
        current_stage: REPORT
        plan:
          - {stage: SURVEY, gate: g1, artifacts_expected: []}
          - {stage: REPORT, gate: g2, artifacts_expected: [report.daily@v1]}
          - {stage: DELIVER, gate: g3, artifacts_expected: [report.daily@v1]}
        todos: []
        budget: {token_max: 100000, token_used: 0, action_max: 10, action_used: 0}
      script:
        - text: 产物已在，申请过门。
          usage: {prompt_tokens: 80, completion_tokens: 20}
          request_input: true
      steps:
        - op: seed_artifact
          id: seed-rejected-artifact
          type: REPORT
          schema_id: report.daily@v1
          # 缺 measurements 时序段 → schema 校验失败 → REJECTED
          content:
            devices: [TX-01]
            conclusion: 缺量测段的报告
            regulation_refs: [PHYS-TX-LOAD]
          expect_status: REJECTED
        - {op: run_task, id: run}
    expect:
      status: WAITING_INPUT
      current_stage: REPORT
      todos_gap_prefix: gap-REPORT-
      stage_gates: [{stage: REPORT, verdict: BLOCKED, missing_status: REJECTED}]
      trace: {valid: true, complete_turns: 1}

  - id: EVAL-M1-GATE-P2
    spec: SPEC-M1-04
    title: P0 告警未清除 → 门禁 BLOCKED 且注入 gap；清除后同阶段重评 PASSED 过门
    form: expression
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task:
        task_id: task-m1
        user_input: 告警阻断场景
        max_turns: 4
        current_stage: S1
        plan:
          - {stage: S1, gate: g1, artifacts_expected: []}
          - {stage: S2, gate: g2, artifacts_expected: []}
          - {stage: S3, gate: g3, artifacts_expected: []}
        todos: []
        budget: {token_max: 100000, token_used: 0, action_max: 10, action_used: 0}
      script:
        - text: 待告警处置。
          usage: {prompt_tokens: 60, completion_tokens: 10}
          request_input: true
        - text: 告警已清除，继续。
          usage: {prompt_tokens: 60, completion_tokens: 10}
          request_input: true
      steps:
        - op: seed_event
          id: alarm
          type: alarm.raised
          subject: AL-GATE-01
          payload: {level: P0, code: TX_OVERLOAD, text: 变压器重过载}
        - {op: run_task, id: run}
        - op: seed_event
          id: clear
          type: alarm.cleared
          subject: AL-GATE-01
          payload: {cleared_by: OP-001}
        - {op: resume, id: resume-after-clear, event: {kind: USER_INPUT, text: 告警已清除}}
    expect:
      status: WAITING_INPUT
      current_stage: S2
      stage_gates:
        - {stage: S1, verdict: BLOCKED, blocking_alarms: true}
        - {stage: S1, verdict: PASSED}
      todos: [{id: gap-S1-1, status: DONE}]
      trace: {valid: true, complete_turns: 2}

  # ================= SPEC-M1-05 预算检查点四口径 =================
  - id: EVAL-M1-05-P
    spec: SPEC-M1-05
    title: "token_max=500，第 3 轮超限 → PAUSED + budget.exhausted{kind: token}，本轮仅 PREPARE 不进 Model"
    form: expression
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task:
        task_id: task-m1
        user_input: 预算耗尽测试
        max_turns: 5
        current_stage: INTAKE
        plan: [{stage: INTAKE, gate: g0, artifacts_expected: []}]
        todos: []
        budget: {token_max: 500, token_used: 0, action_max: 10, action_used: 0}
      script:
        - text: 第一轮。
          usage: {prompt_tokens: 200, completion_tokens: 50}
        - text: 第二轮。
          usage: {prompt_tokens: 180, completion_tokens: 70}
        - text: 第三轮（不应被调用）。
          usage: {prompt_tokens: 10, completion_tokens: 5}
      steps:
        - {op: run_task, id: run}
    expect:
      status: PAUSED
      budget: {token_used: 500}
      event_payloads:
        - {type: budget.exhausted, contains: {kind: token}}
      trace:
        valid: true
        complete_turns: 2
        aborted_prepare_turns: 1
        turns:
          "1": [PREPARE, MODEL, ACT, OBSERVE, VERIFY]
          "2": [PREPARE, MODEL, ACT, OBSERVE, VERIFY]
          "3": [PREPARE]

  - id: EVAL-M1-05-N
    spec: SPEC-M1-05
    title: 超限后无 ResumeEvent 驱动被拒 + PAUSED 恢复前重查预算仍超限被拒（保持 PAUSED）
    form: negative_rejection
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task:
        task_id: task-m1
        user_input: 预算耗尽测试
        max_turns: 5
        current_stage: INTAKE
        plan: [{stage: INTAKE, gate: g0, artifacts_expected: []}]
        todos: []
        budget: {token_max: 500, token_used: 0, action_max: 10, action_used: 0}
      script:
        - text: 第一轮。
          usage: {prompt_tokens: 200, completion_tokens: 50}
        - text: 第二轮。
          usage: {prompt_tokens: 180, completion_tokens: 70}
        - text: 第三轮（不应被调用）。
          usage: {prompt_tokens: 10, completion_tokens: 5}
      steps:
        - {op: run_task, id: run}
        - op: drive
          id: drive-paused
          expect_error: {type: LoopNotResumableError, contains: 拒绝驱动等待/暂停态}
        - op: resume
          id: resume-without-budget
          event: {kind: USER_INPUT, text: 继续执行}
          expect_error: {type: LoopNotResumableError, contains: 预算仍超限}
    expect:
      status: PAUSED
      event_counts: {budget.exhausted: 1}
      trace:
        valid: true
        complete_turns: 2
        aborted_prepare_turns: 1

  - id: EVAL-M1-05-P2
    spec: SPEC-M1-05
    title: 预算检查点矩阵：token/action/deadline/price_window 四口径逐项断言（含窗口内不超限）
    form: expression
    executor: m1.budget
    params:
      checks:
        - budget: {token_max: 500, token_used: 500, action_max: 10, action_used: 0}
          now: "2026-09-28T08:00:00Z"
          expect: {exceeded: true, kind: token}
        - budget: {token_max: 500, token_used: 100, action_max: 3, action_used: 3}
          now: "2026-09-28T08:00:00Z"
          expect: {exceeded: true, kind: action}
        - budget: {token_max: 500, token_used: 100, action_max: 10, action_used: 0,
                   deadline: "2026-09-28T07:00:00Z"}
          now: "2026-09-28T08:00:00Z"
          expect: {exceeded: true, kind: deadline}
        - budget: {token_max: 500, token_used: 100, action_max: 10, action_used: 0,
                   price_window: {from: "2026-09-28T10:00:00Z", to: "2026-09-28T12:00:00Z"}}
          now: "2026-09-28T08:00:00Z"
          expect: {exceeded: true, kind: price_window}
        - budget: {token_max: 500, token_used: 100, action_max: 10, action_used: 0,
                   price_window: {from: "2026-09-28T10:00:00Z", to: "2026-09-28T12:00:00Z"}}
          now: "2026-09-28T11:00:00Z"
          expect: {exceeded: false, ok: true}
        - budget: {token_max: 500, token_used: 100, action_max: 10, action_used: 2}
          now: "2026-09-28T08:00:00Z"
          expect: {exceeded: false, ok: true}
    expect: {}

  # ================= SPEC-M1-06 完成申请与判定分离 =================
  - id: EVAL-M1-06-P
    spec: SPEC-M1-06
    title: 模型申请完成但 evidence 缺 observed → NEED_MORE_EVIDENCE，VERIFYING→RUNNING 注入缺口 todos
    form: expression
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task:
        task_id: task-m1
        user_input: 完成判定测试
        max_turns: 1
        current_stage: WORK
        plan:
          - {stage: WORK, gate: g1, artifacts_expected: []}
          - {stage: DONE, gate: g2, artifacts_expected: []}
