  # ================= SPEC-M1-09 恢复语义（矩阵 + 幂等续跑） =================
  - id: EVAL-M1-09-P
    spec: SPEC-M1-09
    title: Checkpoint 恢复到阶段 2/4 → 从 plan 阶段+todos 续跑，DONE 跳过 + 同键幂等回放（executions=3）
    form: expression
    executor: m1.scenario
    params:
      env: *report3_env
      now: "2026-09-28T08:00:00Z"
      task:
        task_id: task-m1
        user_input: 恢复语义测试
        max_turns: 8
        current_stage: S1
        plan:
          - {stage: S1, gate: g1, artifacts_expected: []}
          - {stage: S2, gate: g2, artifacts_expected: []}
          - {stage: S3, gate: g3, artifacts_expected: []}
          - {stage: S4, gate: g4, artifacts_expected: []}
        todos:
          - {id: t1, text: 量测, status: PENDING}
          - {id: t2, text: 规程, status: PENDING}
          - {id: t3, text: 台账, status: PENDING}
        budget: {token_max: 100000, token_used: 0, action_max: 50, action_used: 0}
      script:
        - text: t1 执行。
          usage: {prompt_tokens: 50, completion_tokens: 10}
          tool_calls:
            - {capability: query.measurement@v1, todo_id: t1, arguments: {device: TX-01},
               purpose: t1 量测}
          todo_updates: [{id: t1, status: DONE}]
          request_input: true
        - text: t2 执行。
          usage: {prompt_tokens: 50, completion_tokens: 10}
          tool_calls:
            - {capability: query.regulation@v1, todo_id: t2,
               arguments: {rule_id: PHYS-TX-LOAD}, purpose: t2 规程}
          todo_updates: [{id: t2, status: DONE}]
          request_input: true
        # 恢复后重放：t1 已 DONE（应跳过）；t2 同幂等键（应回放不重复执行）；t3 新执行
        - text: 恢复后续跑。
          usage: {prompt_tokens: 60, completion_tokens: 10}
          tool_calls:
            - {capability: query.measurement@v1, todo_id: t1, arguments: {device: TX-01},
               purpose: t1 重复请求（应被跳过）}
            - {capability: query.regulation@v1, todo_id: t2,
               arguments: {rule_id: PHYS-TX-LOAD}, purpose: t2 重复请求（幂等回放）}
            - {capability: query.asset@v1, todo_id: t3, arguments: {device: TX-02},
               purpose: t3 台账}
          todo_updates: [{id: t2, status: DONE}, {id: t3, status: DONE}]
          request_input: true
      steps:
        - {op: run_task, id: run1}          # 第 1 轮：t1 DONE，停在 S2（阶段 2/4）
        - {op: snapshot, id: snap, as: ckpt-s2}
        - {op: resume, id: resume-t2, event: {kind: USER_INPUT, text: 继续 t2}}
        - {op: restore, id: restore, from: ckpt-s2}
        - {op: resume, id: resume-rerun, event: {kind: USER_INPUT, text: 恢复重跑}}
    expect:
      status: WAITING_INPUT
      current_stage: S3
      executions: 3                          # t1/t2/t3 各一次：重复请求零二次副作用
      todos:
        - {id: t1, status: DONE}
        - {id: t2, status: DONE}
        - {id: t3, status: DONE}
      evidence_count: 3
      trace: {valid: true, complete_turns: 3}

  - id: EVAL-M1-09-N
    spec: SPEC-M1-09
    title: Resume 状态-种类矩阵错配三连拒（WAITING_APPROVAL×USER_INPUT/ENV_EVENT、WAITING_INPUT×ENV_EVENT）
    form: negative_rejection
