          usage: {prompt_tokens: 60, completion_tokens: 10}
          request_input: true
      steps:
        - {op: run_task, id: run}                      # 第 1 轮 → WAITING_APPROVAL
        - op: resume
          id: wrong-user-input
          event: {kind: USER_INPUT, text: 直接继续}
          expect_error: {type: LoopNotResumableError, contains: 只接受}
        - op: resume
          id: wrong-env-event
          event: {kind: ENV_EVENT}
          expect_error: {type: LoopNotResumableError, contains: 只接受}
        - {op: resume, id: grant, event: {kind: APPROVAL_GRANTED, payload: {approver: OP-004}}}
        - op: resume
          id: wrong-waiting-input
          event: {kind: ENV_EVENT, text: 环境事件}
          expect_error: {type: LoopNotResumableError, contains: 只接受}
    expect:
      status: WAITING_INPUT
      evidence_count: 1
      executions: 1
      accepted_transitions:
        - {from: RUNNING, to: WAITING_APPROVAL}
        - {from: WAITING_APPROVAL, to: RUNNING}
      trace: {valid: true, complete_turns: 2}

