    form: expression
    executor: m1.model
    params:
      prompt: 继续执行日巡检任务
      mock:
        script:
          - {text: 第一轮响应, usage: {prompt_tokens: 100, completion_tokens: 40}}
          - {text: 第二轮响应, usage: {prompt_tokens: 60, completion_tokens: 40}}
      remote:
        api_base: https://model.internal.example/v1
        cases:
          - name: retry-then-ok
            sequence:
              - [429, {error: {message: 限流}}]
              - [200, {choices: [{message: {content: 重试后成功}}],
                       usage: {prompt_tokens: 10, completion_tokens: 5}}]
            expect_status: ok
            expect_calls: 2
            expect_text: 重试后成功
          - name: exhaust-on-500
            sequence: [[500, {error: {message: 服务端错误}}]]
            max_retries: 2
            expect_status: retry_exhausted
            expect_calls: 3
          - name: timeout-classified
            sequence: [TIMEOUT, TIMEOUT, TIMEOUT]
            max_retries: 2
            expect_status: timeout
            expect_calls: 3
    expect:
      mock_cost_total: 240
      mock_scripted_usage: {prompt_tokens: 100, completion_tokens: 40}

