        budget: {token_max: 100000, token_used: 0, action_max: 10, action_used: 0}
      script:
        - text: 发起电容投切申请。
          usage: {prompt_tokens: 100, completion_tokens: 30}
          tool_calls:
            - {capability: execute.capacitor_switch@v1, todo_id: t1,
