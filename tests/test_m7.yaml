  - id: EVAL-M7-12-N
    spec: SPEC-M7-12
    title: 二次发布/向已发布目录补写 3 文件/非法迁移（PUBLISHED→GATED、DRAFT、重复 PUBLISHED）全拒，内容零变化
    form: negative_rejection
    executor: m7.immutable
