  # ================= SPEC-M7-14 AgentContract 资产契约 =================
  - id: EVAL-M7-14-N
    spec: SPEC-M7-14
    title: AgentContract 校验拒绝 7 态（缺域/越界域/约束缺 assertion/约束 id 重复/类目越界/domain 越界/case_id 重复）
    form: negative_rejection
    executor: m7.contract_validation
    params:
      probes:
        - name: 缺能力域
          descriptor:
            <<: *contract_base
            capability_domains: &five_domains
              PREDICT: {name: PREDICT, description: 态势感知与越限研判}
              DISPATCH: {name: DISPATCH, description: 两票制遥控编排与审批}
              MAINTAIN: {name: MAINTAIN, description: 巡检/台账/缺陷闭环}
              PLAN: {name: PLAN, description: 巡检与检修计划编排}
              TRADE: {name: TRADE, description: 电价时段与需量控制}
          error_contains: [六能力域不齐]
        - name: 能力域越界
          descriptor:
            <<: *contract_base
            capability_domains:
              PREDICT: {name: PREDICT, description: 态势感知与越限研判}
              DISPATCH: {name: DISPATCH, description: 两票制遥控编排与审批}
              MAINTAIN: {name: MAINTAIN, description: 巡检/台账/缺陷闭环}
              PLAN: {name: PLAN, description: 巡检与检修计划编排}
              SELF_HEAL: {name: SELF_HEAL, description: 中断/失真诚实上报}
              TRADE: {name: TRADE, description: 电价时段与需量控制}
              MAINTENANCE: {name: MAINTENANCE, description: 越界域}
          error_contains: [能力域越界]
        - name: 约束缺 assertion
          descriptor:
            <<: *contract_base
            constraints:
              - {id: CL-EVAL-1, text: 无操作票的遥控必须被拒, source: SAFE-TWO-TICKET}
          error_contains: [缺 assertion]
        - name: 约束 id 重复
          descriptor:
            <<: *contract_base
            constraints:
              - {id: CL-EVAL-1, text: 约束一, source: eval, assertion: a1}
              - {id: CL-EVAL-1, text: 约束二, source: eval, assertion: a2}
          error_contains: [id 重复]
        - name: 行为目录类目越界
          descriptor:
            <<: *contract_base
            behavior_catalog:
              - {case_id: case_001, category: weird, domain: MAINTAIN, anchor: behavior:x}
          error_contains: [category 越界]
        - name: 行为目录 domain 越界
          descriptor:
            <<: *contract_base
            behavior_catalog:
              - {case_id: case_001, category: normal, domain: MAINTENANCE, anchor: behavior:x}
          error_contains: [domain 越界]
        - name: 行为目录 case_id 重复
          descriptor:
            <<: *contract_base
            behavior_catalog:
              - {case_id: case_001, category: normal, domain: MAINTAIN, anchor: behavior:x}
              - {case_id: case_001, category: red_line, domain: DISPATCH, anchor: SAFE-TWO-TICKET}
          error_contains: [case_id 重复]
    expect: {}

  # ================= SPEC-M7-15 diff_release（轨迹漂移对比） =================
  - id: EVAL-M7-15-P
    spec: SPEC-M7-15
    title: 两 bundle 差分：引用集增/删/改+标量变化布尔+成绩差分，diff 结构逐字段等于期望
    form: contract
    executor: m7.diff
    params:
      a:
        release_id: rel-a
        model_ref: mock-scripted@offline-v1
        prompt_refs: ["prompts/daily-inspection@v1#aa"]
        skill_refs: ["skill.overload-response@0.1.0#bb"]
        tool_refs: ["tools/query.measurement@v1#cc"]
        ontology_version: onto-hash-a
        golden_scores: {pass_rate: 1.0, golden_set_version: dev-v1, by_domain: {}}
        frozen_scenarios: [dev-01-report]
        contract_version: '1.1'
      b:
        release_id: rel-b
        model_ref: mock-scripted@offline-v2
        prompt_refs: ["prompts/daily-inspection@v1#aa", "prompts/overload-response@v1#dd"]
        skill_refs: ["skill.overload-response@0.2.0#ee"]
        tool_refs: ["tools/query.measurement@v1#cc", "tools/write.report@v1#ff"]
        ontology_version: onto-hash-a
        golden_scores: {pass_rate: 0.95, golden_set_version: dev-v2, by_domain: {}}
        frozen_scenarios: [dev-01-report, dev-02-alarm]
        contract_version: '1.1'
    expect:
      fields:
        model_ref_changed: true
        ontology_changed: false
        contract_version_changed: false
        prompt_refs: {added: [prompts/overload-response], removed: [], changed: []}
        skill_refs: {added: [], removed: [], changed: [skill.overload-response]}
        tool_refs: {added: [tools/write.report], removed: [], changed: []}
        golden_delta:
          {pass_rate_a: 1.0, pass_rate_b: 0.95,
           golden_set_version_a: dev-v1, golden_set_version_b: dev-v2}

