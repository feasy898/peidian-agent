# tests/test_m2.yaml
# M2（信息层）EVAL v2 · 按 specs-v2/M2-information.md（SPEC-M2-01..14，14 条）机械重生成。
# 用例 30 条（正例 14 + 负例 16），映射完整：每条 v2 条款 ≥1 用例（双向表见该文件 §4）。
# 2026-09-29 变异测试缺口补齐：+EVAL-M2-07-N2（put_task 乐观锁，plan-m2 m2-optimistic-lock-off）、
# +EVAL-M2-12-N3（Knowledge 注册评审门禁，plan-m2 m2-knowledge-register-open）、
# +EVAL-M2-09-N2（跨任务写兜底拒绝分支——evidence/ 路径过 _check_cross 后仍须拒，plan-m2
# m2-crosswrite-allow），执行器在 tests/m2_eval_extra.py（tests 侧插件，零 oracle 改动）。
# spec_ref 切换至 specs-v2 三件（M2/00/01）；v1 ADDENDUM §B 内容已折叠入 01 v2 §3.2 D-68
# 与 SPEC-M2-10，故不再列入 spec_ref。v1→v2 用例 id 映射：
#   EVAL-M2-01-P/N、02-P、03-P/N、04-P、05-P/N、06-P 同名保留（逐条核对断言与 v2 条款一致）；
#   EVLOG-P→07-P；07-P/N(workspace)→09-P/N；08-P→10-P；08-P2→10-P2(兼07)；08-N→10-N；
#   08-N2→10-N2；09-P/N(evidence)→11-P/N；10-P/N/N2(memory)→12-P/N/N2；11-P→13-P；12-P→14-P。
#   新增 4 条：EVAL-M2-02-N（type 14 值封闭集）、EVAL-M2-04-N（source 封闭字段集）、
#   EVAL-M2-07-N（事件缺 trace_id 写入即拒）、EVAL-M2-14-N（DEPRECATED/REVIEW 不入层+披露拒绝）。
# 覆盖披露：SPEC-M2-08 的 sessions/calls 表与 DSN NotImplementedError 分支无用例
# （执行器插件位于 src/，本阶段不改动；条款由 EVAL-M2-06-P/07-P 的 StateStore 持久栈随行覆盖）。
# schema 见 tests/EVAL-SCHEMA.md；插件执行器注册于 src/m2_information/eval_plugin.py；
# spec_hash 口径（01§6）：spec_ref 列表按序拼接文件字节的 sha256。
suite: m2
title: M2 信息层（Context/状态/Artifact/Memory/Skill 披露）EVAL v2
spec_ref:
  - specs-v2/M2-information.md
  - specs-v2/00-ontology.md
  - specs-v2/01-contracts.md
spec_hash: 8804ebce740f13259912dbfd1edbd0f35e657c50a160b0cedcf4a7b5a515feaa
executors:
  - module: m2_information.eval_plugin
  - module: tests.m2_eval_extra

cases:
  # ================= SPEC-M2-01 确定性编译与 hash 口径 =================
  - id: EVAL-M2-01-P
    spec: SPEC-M2-01
    title: 同状态同轮编译两次 hash 一致；skill 资产版本变更（origin 指纹）后 hash 必变
    form: expression
    executor: m2.compile_determinism
    params:
      task:
        task_id: task-m2-01
        user_input: 生成今日巡检报告并归档读数证据
        plan:
          - {stage: collect, gate: gate-data, artifacts_expected: [report.daily@v1]}
          - {stage: report, gate: gate-schema, artifacts_expected: [report.daily@v1]}
        todos:
          - {id: todo-1, text: 读取 A 配电房量测, status: DONE}
      skills:
        - skill_id: pq-analysis
          version: 1.2.0
          capability_domain: PREDICT
          disclosure:
            level0: 电能质量分析技能
            level1: 分析电压 THD 与功率因数越限并给出处置建议
            level2_ref: "FULLTEXT：电能质量分析技能全文（阈值口径、处置清单、复盘模板）"
          entry: {checklist: 清单-电能质量}
          evidence_policy: 处置建议须挂三态证据与规则 ID
          owner: m7-registry
          status: PUBLISHED
      skills_v2:
        - skill_id: pq-analysis
          version: 1.3.0
          capability_domain: PREDICT
          disclosure:
            level0: 电能质量分析技能
            level1: 分析电压 THD 与功率因数越限并给出处置建议（新版）
            level2_ref: "FULLTEXT：电能质量分析技能全文 v1.3.0"
          entry: {checklist: 清单-电能质量}
          evidence_policy: 处置建议须挂三态证据与规则 ID
          owner: m7-registry
          status: PUBLISHED
      turn: 1
      compile_options:
        task_domains: [PREDICT]
    expect: {}

  - id: EVAL-M2-01-N
    spec: SPEC-M2-01
    title: 向编译注入两个不同墙钟读数 → hash 不受影响（compiled_at 不进 hash）
    form: negative_rejection
    executor: m2.compile_wallclock
    params:
      task:
        task_id: task-m2-01n
        user_input: 复核昨日负荷曲线
        todos: [{id: todo-1, text: 拉取曲线, status: IN_PROGRESS}]
      now_list:
        - "2026-09-28T08:00:00Z"
        - "2027-03-01T23:59:59Z"
      turn: 2
    expect: {}

  # ================= SPEC-M2-02 分层结构 =================
  - id: EVAL-M2-02-P
    spec: SPEC-M2-02
    title: 100 轮任务全部 Manifest 层序恒定，无跳层覆盖（冲突按层序前者覆盖后者）
    form: expression
    executor: m2.layers
    params:
      task:
        task_id: task-m2-02
        user_input: 持续监测 A 配电房电能质量并按需分析
        plan:
          - {stage: collect, gate: gate-data, artifacts_expected: [report.daily@v1]}
        todos:
          - {id: todo-1, text: 轮询量测, status: IN_PROGRESS}
      turns: 100
      event:
        capability: query.measurement@v1
        observation: "第{turn}轮读数正常"
        status: SUCCEEDED
      compile_options:
        task_domains: [PREDICT]
      extra_sources:
        - name: tenant.override
          type: TENANT_RULE
          text: 租户试图放宽审批通道的覆盖指令
          origin: injected/tenant-override
          directives: {approval_channel: loose}
      expect_directives:
        approval_channel: strict
      expect_conflicts: 100
    expect: {}

  - id: EVAL-M2-02-N
    spec: SPEC-M2-02
    title: source type 越界（14 值封闭集之外）→ 契约构造拒绝
    form: contract
    params:
      structure: ContextManifest
      op: reject
      payload:
        task_id: task-m2-02n
        turn: 1
        sources:
          - {name: rogue.source, type: NOT_A_LAYER, tokens: 1, priority: 1, origin: injected/rogue}
        total_tokens: 1
        budget_remaining: 0
        compiled_at: "2026-09-29T00:00:00Z"
        hash: placeholder-hash
    expect:
      error_contains: 枚举越界

  # ================= SPEC-M2-03 预算裁剪（policy 永不裁） =================
  - id: EVAL-M2-03-P
    spec: SPEC-M2-03/SPEC-M2-04
    title: 预算 4000 tokens、源总量约 9000 → 裁剪后 ≤4000 且 policy 层 token 不变，裁剪记录双落留档
    form: expression
    executor: m2.budget_trim
    params:
      task:
        task_id: task-m2-03
        user_input: 汇总月度运行分析
        todos: [{id: todo-1, text: 汇总, status: IN_PROGRESS}]
      turn: 1
      budget: 4000
      extra_sources:
        - {name: bulk-0, type: WORKSPACE_REF, tokens: 1500, origin: injected/bulk-0}
        - {name: bulk-1, type: WORKSPACE_REF, tokens: 1500, origin: injected/bulk-1}
        - {name: bulk-2, type: WORKSPACE_REF, tokens: 1500, origin: injected/bulk-2}
        - {name: bulk-3, type: WORKSPACE_REF, tokens: 1500, origin: injected/bulk-3}
        - {name: bulk-4, type: WORKSPACE_REF, tokens: 1500, origin: injected/bulk-4}
        - {name: bulk-5, type: WORKSPACE_REF, tokens: 1500, origin: injected/bulk-5}
    expect: {}

  - id: EVAL-M2-03-N
    spec: SPEC-M2-03
    title: 构造 policy 被裁场景（预算小于 policy 层 token）→ 拒绝编译，触发 budget.exhausted + PAUSED
    form: negative_rejection
    executor: m2.budget_protect
    params:
      task:
        task_id: task-m2-03n
        user_input: 极小预算任务
      start_status: RUNNING
      budget: 3
      turn: 1
      error_contains: 永不裁剪
    expect: {}

  # ================= SPEC-M2-04 Manifest 完整与裁剪双落 =================
  - id: EVAL-M2-04-P
    spec: SPEC-M2-04
    title: Manifest 记录全部 source 五字段；总 token 与各源之和一致；余额=预算-总量；round-trip hash 不变
    form: expression
    executor: m2.manifest_complete
    params:
      task:
        task_id: task-m2-04
        user_input: 巡检报告生成
        plan:
          - {stage: collect, gate: gate-data, artifacts_expected: [report.daily@v1]}
        todos: [{id: todo-1, text: 取数, status: DONE}]
      turns: 3
      event:
        capability: query.measurement@v1
        observation: "第{turn}轮读数正常"
      budget: 100000
      extra_sources:
        - {name: workspace.ref, type: WORKSPACE_REF, tokens: 120, origin: injected/manifest}
      turn: 2
    expect: {}

  - id: EVAL-M2-04-N
    spec: SPEC-M2-04
    title: source 携带未知字段（五字段封闭集之外）→ 契约构造拒绝
    form: contract
    params:
      structure: ContextManifest
      op: reject
      payload:
        task_id: task-m2-04n
        turn: 1
        sources:
          - {name: note.source, type: SKILL, tokens: 1, priority: 1, origin: injected/note, note: 裁剪注记想塞进字段}
        total_tokens: 1
        budget_remaining: 0
        compiled_at: "2026-09-29T00:00:00Z"
        hash: placeholder-hash
    expect:
      error_contains: 未知字段

  # ================= SPEC-M2-05 压缩四步 =================
  - id: EVAL-M2-05-P
    spec: SPEC-M2-05
    title: 50 轮后压缩 → Commit/Compact/Rebuild/Validate 四步通过，五要素齐全落盘
    form: expression
    executor: m2.compact_ok
    params:
      task:
        task_id: task-m2-05
        user_input: 生成日巡检报告并归档读数证据
        plan:
          - {stage: collect, gate: gate-data, artifacts_expected: [report.daily@v1]}
          - {stage: report, gate: gate-schema, artifacts_expected: [report.daily@v1]}
        todos:
          - {id: todo-1, text: 读取量测, status: DONE}
          - {id: todo-2, text: 生成报告, status: IN_PROGRESS}
      turns: 50
      event:
        capability: query.measurement@v1
        observation: "第{turn}轮读数正常"
        status: SUCCEEDED
      compact_turn: 50
    expect: {}

  - id: EVAL-M2-05-N
    spec: SPEC-M2-05
    title: 篡改 Compact 丢"验收缺口"要素 → Validate 失败回滚，任务状态与版本不变
    form: negative_rejection
    executor: m2.compact_tamper
    params:
      task:
        task_id: task-m2-05n
        user_input: 生成日巡检报告
        plan:
          - {stage: collect, gate: gate-data, artifacts_expected: [report.daily@v1]}
        todos: [{id: todo-1, text: 生成报告, status: IN_PROGRESS}]
      turns: 50
      event:
        capability: query.measurement@v1
        observation: "第{turn}轮读数正常"
      compact_turn: 51
      drop_element: acceptance_gaps
      error_contains: acceptance_gaps
    expect: {}

  # ================= SPEC-M2-06 Checkpoint 恢复与事件重建 =================
  - id: EVAL-M2-06-P
    spec: SPEC-M2-06/SPEC-M2-08
    title: Checkpoint 含 TaskState 全量+Workspace manifest 快照；恢复后回到快照点可续跑
    form: expression
    executor: m2.checkpoint
    params:
      task:
        task_id: task-m2-06
        user_input: 阶段性检修分析
        current_stage: COLLECT
        plan:
          - {stage: collect, gate: gate-data, artifacts_expected: []}
          - {stage: analyze, gate: gate-rule, artifacts_expected: [report.daily@v1]}
      mutations:
        - {status: RUNNING}
        - {current_stage: ANALYZE}
      workspace_files:
        scratch/draft.txt: 分析草稿第一版
      mutations_after_snapshot:
        - {current_stage: REPORT, note: 快照后推进}
    expect: {}

  # ================= SPEC-M2-07 状态提交与事件溯源 =================
  - id: EVAL-M2-07-P
    spec: SPEC-M2-06/SPEC-M2-07/SPEC-M2-08
    title: 完整任务生命周期（含 from==to 非状态字段提交）后，从空库仅凭事件流按 apply_state_mutation 折叠重建 TaskState 与库内快照 diff 为空
    form: expression
    executor: m2.eventlog_rebuild
    params:
      task:
        task_id: task-m2-evlog
        user_input: 生成日巡检报告
        plan:
          - {stage: collect, gate: gate-data, artifacts_expected: [report.daily@v1]}
      turns: 5
      event:
        capability: query.measurement@v1
        observation: "第{turn}轮读数正常"
      todos:
        - {id: todo-1, text: 读取量测, status: DONE}
      report_content:
        devices:
          - {device_id: TX-01, name_cn: 1 号变压器}
        measurements:
          - device_ref: TX-01
            quantity: winding_temp
            points:
              - {ts: "2026-09-28T08:00:00Z", value: 72}
              - {ts: "2026-09-28T12:00:00Z", value: 75}
        conclusion: 变压器温度趋势平稳，未见越限
        regulation_refs: [PHYS-TX-LOAD]
      turn: 3
    expect: {}

  - id: EVAL-M2-07-N
    spec: SPEC-M2-07
    title: 事件缺 trace_id → 写入即拒（EventRecord 契约强制，01§8 横切）
    form: negative_rejection
    params:
      attempt: event_append
      payload:
        event_id: evt-m2-07n
        type: task.created
        subject: task-m2-07n
        payload: {user_input: 缺 trace_id 的事件}
        occurred_at: "2026-09-29T00:00:00Z"
        producer: M2
    expect:
      error_contains: 必填字段缺失

  - id: EVAL-M2-07-N2
    spec: SPEC-M2-07
    title: 乐观锁——过期基线提交（expected_version 过期）→ OptimisticLockError 且库内版本不被污染
    form: negative_rejection
    executor: m2x.optimistic_lock
    params:
      task: {task_id: task-m2-07nb, user_input: 乐观锁验证}
      mutations:
        - {status: RUNNING}
      stale_expected_version: 1
      error_contains: 版本冲突
    expect: {}

  # ================= SPEC-M2-09 Workspace 隔离 =================
  - id: EVAL-M2-09-P
    spec: SPEC-M2-09
    title: 任务 A 引用任务 B 的 scratch 文件被拒；引用 B 的 PUBLISHED artifact 允许（只读）
    form: expression
    executor: m2.workspace_isolation
    params:
      actor_task: task-m2-09wa
      owner_task: task-m2-09wb
      scratch_rel: scratch/notes.txt
      scratch_content: 任务 B 内部草稿（不可跨任务读）
      error_contains: 不在 artifacts/ 或 evidence/ 下
      report_content:
        devices:
          - {device_id: TX-02, name_cn: 2 号变压器}
        measurements:
          - device_ref: TX-02
            quantity: winding_temp
            points:
              - {ts: "2026-09-28T08:00:00Z", value: 68}
        conclusion: 变压器温度正常
        regulation_refs: [PHYS-TX-LOAD]
      report_content_conclusion: 变压器温度正常
    expect: {}

  - id: EVAL-M2-09-N
    spec: SPEC-M2-09
    title: 任务 A 写任务 B 的 artifacts/ → 拒绝 + 审计事件（action.policy_decided DENY，D-06③）
    form: negative_rejection
    executor: m2.workspace_crosswrite
    params:
      actor_task: task-m2-09na
      owner_task: task-m2-09nb
      target_rel: artifacts/evil.txt
      payload: 越权写入内容
      error_contains: 跨任务写被拒
    expect: {}

  - id: EVAL-M2-09-N2
    spec: SPEC-M2-09
    title: 任务 A 写任务 B 的 evidence/（路径类别通过跨任务读白名单）→ 兜底一律拒绝仍生效 + 审计事件
    form: negative_rejection
    executor: m2.workspace_crosswrite
    params:
      actor_task: task-m2-09nc
      owner_task: task-m2-09nd
      target_rel: evidence/leak.json
      payload: {device_ref: TX-01, quantity: winding_temp, value: 1, ts: "2026-09-29T00:00:00Z"}
      error_contains: 跨任务写被拒
    expect: {}

  # ================= SPEC-M2-10 Artifact 状态机与 schema 钩子 =================
  - id: EVAL-M2-10-P
    spec: SPEC-M2-10
    title: REPORT 校验通过 → NONE→DRAFT→VALIDATING→READY→PUBLISHED 全事件可回放
    form: expression
    executor: m2.artifact_lifecycle
    params:
      task:
        task_id: task-m2-10a
        user_input: 生成日巡检报告
        plan:
          - {stage: report, gate: gate-schema, artifacts_expected: [report.daily@v1]}
      report_content:
        devices:
          - {device_id: TX-01, name_cn: 1 号变压器}
          - {device_id: BUS-A1, name_cn: A 段母线}
        measurements:
          - device_ref: TX-01
            quantity: winding_temp
            points:
              - {ts: "2026-09-28T08:00:00Z", value: 71}
              - {ts: "2026-09-28T12:00:00Z", value: 74}
              - {ts: "2026-09-28T16:00:00Z", value: 73}
          - device_ref: BUS-A1
            quantity: voltage_ratio
            points:
              - {ts: "2026-09-28T08:00:00Z", value: 1.01}
        conclusion: 设备运行正常，负载率与电压偏差均在合格范围
        regulation_refs: [PHYS-TX-LOAD, PHYS-V-RANGE]
      expect_events:
        - [NONE, DRAFT]
        - [DRAFT, VALIDATING]
        - [VALIDATING, READY]
        - [READY, PUBLISHED]
    expect: {}

  - id: EVAL-M2-10-P2
    spec: SPEC-M2-07/SPEC-M2-10
    title: task/artifact 迁移表与冻结基准（tests/fixtures/frozen_state_machines.yaml）diff 为空
    form: expression
    executor: m2.state_tables
    params:
      table: tests/fixtures/frozen_state_machines.yaml
    expect: {}

  - id: EVAL-M2-10-N
    spec: SPEC-M2-10
    title: schema 缺 conclusion 段提交 → VALIDATING 自动落 REJECTED 且失败 detail 点名缺段
    form: negative_rejection
    executor: m2.artifact_invalid
    params:
      task:
        task_id: task-m2-10na
        user_input: 生成缺字段报告
      report_content:
        devices:
          - {device_id: TX-03, name_cn: 3 号变压器}
        measurements:
          - device_ref: TX-03
            quantity: winding_temp
            points:
              - {ts: "2026-09-28T08:00:00Z", value: 66}
        conclusion: 本应存在但被用例删除的结论段
        regulation_refs: [PHYS-TX-LOAD]
      omit_sections: [conclusion]
      error_contains: conclusion
    expect: {}

  - id: EVAL-M2-10-N2
    spec: SPEC-M2-10
    title: regulation_refs 引用不存在规则 ID（D-68 存在性联动）→ REJECTED（非仅形态校验）
    form: negative_rejection
    executor: m2.artifact_invalid
    params:
      task:
        task_id: task-m2-10nb
        user_input: 引用不存在规程条款的报告
      report_content:
        devices:
          - {device_id: TX-03, name_cn: 3 号变压器}
        measurements:
          - device_ref: TX-03
            quantity: winding_temp
            points:
              - {ts: "2026-09-28T08:00:00Z", value: 66}
        conclusion: 四段形态齐全但规程引用不可解析
        regulation_refs: [PHYS-TX-LOAD, PHYS-BOGUS-999]
      omit_sections: []
      error_contains: 规则 ID 不存在
    expect: {}

  # ================= SPEC-M2-11 证据门 =================
  - id: EVAL-M2-11-P
    spec: SPEC-M2-11
    title: evidence/ 接受 ActionResult.evidence 三态序列化与只读读数快照（单点/多点）
    form: expression
    executor: m2.evidence_gate
    params:
      task: {task_id: task-m2-11ea, user_input: 归档取证}
      accept:
        action-ev-1:
          action_id: act-901
          evidence:
            intended: {capability: query.measurement@v1, arguments: {device: TX-01}}
            issued: {executor: sim, issued_at: "2026-09-28T08:00:01Z"}
            observed: {quantity: winding_temp, value: 74, ts: "2026-09-28T08:00:02Z"}
        snapshot-ev-1:
          device_ref: TX-01
          quantity: winding_temp
          value: 74
          unit: C
