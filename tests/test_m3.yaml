  # ================= SPEC-M3-09 幂等与 write-ahead journal（D-28 幂等半，v1 旧 08）=================
  - id: EVAL-M3-09-P
    spec: SPEC-M3-09
    title: 同 key 二发（首结果 SUCCEEDED）→ 同 action_id 同 status，executions=1，M5 状态零变化
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-801
            task_id: task-dev-801
            capability: create.switch_order@v1
            purpose: 创建操作票（首次执行）
            arguments: {code: SO-0915-801, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
            risk: {level: MEDIUM, reversible: true}
            idempotency_key: idem-801
        - {op: snapshot, id: s1}
        - id: r2
          op: request
          now: 2026-09-15T08:01:00Z
          request:                       # 同 key 重发（action_id 不同）→ 返回首个结果
            <<: *query_req
            action_id: act-802
            task_id: task-dev-801
            turn: 2
            capability: create.switch_order@v1
            purpose: 同 key 重发（不得二次执行）
            arguments: {code: SO-0915-801, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
            risk: {level: MEDIUM, reversible: true}
            idempotency_key: idem-801
        - {op: snapshot, id: s2}
    expect:
      results:
        r1: {status: SUCCEEDED}
        r2: {action_id: act-801, status: SUCCEEDED}   # 含原 action_id 同 status
      executions: 1
      snapshots_equal: [[s2, s1]]      # 二发后 M5 状态零变化

  - id: EVAL-M3-09-P2
    spec: SPEC-M3-09
    title: write-ahead claim——执行器崩溃（claim 后中断）同 key 重试 → 零二次副作用
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway: {evaluation: true}
      steps:
        - {op: snapshot, id: s0}
        - id: c1
          op: crash_claim              # 白盒崩溃注入：副作用前只落幂等 claim 即中断
          request:
            <<: *query_req
            action_id: act-803
            task_id: task-dev-803
            capability: create.switch_order@v1
            purpose: 崩溃注入的首次请求
            arguments: {code: SO-0915-803, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
            risk: {level: MEDIUM, reversible: true}
            idempotency_key: idem-803
            requested_at: 2026-09-15T08:00:00Z
        - {op: restart}
        - id: r1
          op: request
          now: 2026-09-15T08:01:00Z
          request:                       # 同 key 重试 → 命中崩溃 claim，不执行
            <<: *query_req
            action_id: act-803
            task_id: task-dev-803
            capability: create.switch_order@v1
            purpose: 崩溃后同 key 重试（不得二次副作用）
            arguments: {code: SO-0915-803, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
            risk: {level: MEDIUM, reversible: true}
            idempotency_key: idem-803
        - {op: snapshot, id: s1}
    expect:
      results: {r1: {action_id: act-803, status: REQUESTED}}
      executions: 0
      snapshots_equal: [[s1, s0]]

  # ================= SPEC-M3-10 证据三态与失联执行器（D-29，v1 旧 09）=================
  - id: EVAL-M3-10-P
    spec: SPEC-M3-10
    title: 失联执行器（isolate_execution_env）自报成功但环境回读未变 → FAILED/OBSERVATION_MISMATCH
    form: expression
    executor: m3.execute
    params:
      env:
        park_instance: seed
        clock_start: 2026-09-15T08:00:00Z
        switch_orders:
          SO-0915-006: {status: ISSUED, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
      gateway:
        evaluation: true
        isolate_execution_env: true    # 执行落在环境深拷贝：执行器自报成功，真实环境未变
      steps:
        - {op: snapshot, id: s0}
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-901
            task_id: task-dev-901
            capability: execute.remote_control@v1
            purpose: 失联执行器场景：自报成功但回读未变
            arguments: {device: SG-A02, operation: OPEN, switch_order: SO-0915-006}
            risk: {level: HIGH, reversible: false}
            idempotency_key: idem-901
        - id: a1
          op: approve
          action_id: act-901
          decision: GRANT
          approver: OP-004
          now: 2026-09-15T08:01:00Z
        - {op: snapshot, id: s1}
    expect:
      results:
        a1: {status: FAILED, error_code: OBSERVATION_MISMATCH, error_contains: 环境回读}
      snapshots_equal: [[s1, s0]]      # 真实环境零变化
      event_payloads:
        - {stream: task-dev-901, type: action.completed, contains: {status: FAILED}}

