  # ================= SPEC-M3-12 trace/事件确定性口径（D-30，v2 新增覆盖）=================
  - id: EVAL-M3-12-P
    spec: SPEC-M3-12
    title: 双沙箱同操作序重放 → 任务事件流逐字节一致；EVT-M3-<seq> 流内严格递增（restart 续序）；trace_id 从 task 派生
    form: expression
    executor: m3.determinism
    params:
      env:
        park_instance: seed
        clock_start: 2026-09-15T08:00:00Z
        switch_orders:
          SO-DET-001: {status: ISSUED, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-1201
            task_id: task-det-120
            turn: 1
            capability: query.measurement@v1
            purpose: 确定性重放探针（ALLOW 直执行）
            arguments: {device: TX-01}
            idempotency_key: idem-1201
        - id: r2
          op: request
          now: 2026-09-15T08:01:00Z
          request:
            <<: *query_req
            action_id: act-1202
            task_id: task-det-120
            turn: 2
            capability: execute.remote_control@v1
            purpose: 确定性重放探针（ASK→审批）
            arguments: {device: SG-A02, operation: OPEN, switch_order: SO-DET-001}
            risk: {level: HIGH, reversible: false}
            idempotency_key: idem-1202
        - {op: restart}               # 重启：journal 重放续接（事件序号必须继续递增）
        - id: a1
          op: approve
          action_id: act-1202
          decision: GRANT
          approver: OP-004
          now: 2026-09-15T08:02:00Z
    expect:
      byte_identical: true
      seq_continuous: true
      trace_derive: true
      event_id_prefix: EVT-M3-
      trace_prefix: trace-

