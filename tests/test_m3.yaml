# ---------------------------------------------------------------------------
# 公共请求模板说明（YAML 锚点）：风险级与 00§1.3 动作表一致；
# requested_at/now 全部显式（确定性，不触墙钟，SPEC-M3-14）；trace_id 由 task 派生。
# v1→v2 条款重排映射：旧 08(幂等)→09、旧 09(证据三态)→10、旧 10(路由)→11、
# 旧 11(负向矩阵)→15、旧 APPR1-N→08-N、旧 APPR2-N→13-N（详见 specs-v2 §0 映射表）。
# ---------------------------------------------------------------------------
cases:
  # ================= SPEC-M3-01 三事实区分与披露面 =================
  - id: EVAL-M3-01-P
    spec: SPEC-M3-01
    title: 已注册已披露角色发 query.measurement → 正常执行链（注册≠披露≠授权三事实成立）
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request: &query_req
            action_id: act-101
            task_id: task-dev-101
            turn: 1
            capability: query.measurement@v1
            actor: {user: OP-001, agent: park-agent@v0.1.0}
            purpose: 读取 TX-01 当前有功功率
            arguments: {device: TX-01}
            risk: {level: LOW, reversible: false}
            idempotency_key: idem-101
            requested_at: 2026-09-15T08:00:00Z
    expect:
      results: {r1: {action_id: act-101, status: SUCCEEDED, error_code: null}}
      decisions: {r1: ALLOW}
      event_seqs:
        task-dev-101: [action.requested, action.policy_decided, action.executing, action.completed]

  - id: EVAL-M3-01-N
    spec: SPEC-M3-01
    title: 请求未注册动作 query.secret → REJECTED/UNREGISTERED（不进主链）
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-102
            task_id: task-dev-102
            capability: query.secret@v1
            idempotency_key: idem-102
    expect:
      results: {r1: {status: REJECTED, error_code: UNREGISTERED}}
      event_types_absent:
        task-dev-102: [action.requested, action.executing, action.completed]
      event_payloads:
        - {type: action.policy_decided, contains: {decision: DENY, stage: admission, error_code: UNREGISTERED}}

  - id: EVAL-M3-01-N2
    spec: SPEC-M3-01
    title: 已注册但未对该角色披露 → 同样 REJECTED（NOT_DISCLOSED）
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway: {evaluation: true}
      register:
        - capability_id: query.custom_telemetry@v1
          action_id: query.custom_telemetry
          version: v1
          name_cn: 定制遥测查询
          risk_level: LOW
          reversible: false
          default_policy: ALLOW
          policy_locked: false
          params_schema: {type: object, required: [point], properties: {point: {type: string}}}
          disclosed_roles: [值班员]   # 只对值班员披露
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-103
            task_id: task-dev-103
            capability: query.custom_telemetry@v1
            arguments: {point: TX-01.p_kw}
            idempotency_key: idem-103
            actor: {user: OP-004, agent: park-agent@v0.1.0}   # 审批人（未披露角色）
    expect:
      results: {r1: {status: REJECTED, error_code: NOT_DISCLOSED}}
      event_types_absent:
        task-dev-103: [action.requested, action.executing]
      event_payloads:
        - {type: action.policy_decided, contains: {stage: admission, error_code: NOT_DISCLOSED}}

  # ================= SPEC-M3-02 准入管线（失败不进生命周期，D-24）=================
  - id: EVAL-M3-02-N
    spec: SPEC-M3-02
    title: ActionRequest 缺 idempotency_key → 契约拒绝（CONTRACT_INVALID），不进主事件链
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            action_id: act-201
            task_id: task-dev-201
            turn: 1
            capability: query.measurement@v1
            actor: {user: OP-001, agent: park-agent@v0.1.0}
            purpose: 缺幂等键的请求
            arguments: {device: TX-01}
            risk: {level: LOW, reversible: false}
            requested_at: 2026-09-15T08:00:00Z
    expect:
      results:
        r1: {status: REJECTED, error_code: CONTRACT_INVALID, error_contains: idempotency_key}
      event_types_absent:
        task-dev-201: [action.requested, action.executing, action.completed]

  - id: EVAL-M3-02-N2
    spec: SPEC-M3-02
    title: arguments 类型错（string 传 int）→ REJECTED/SCHEMA_INVALID + 错误路径
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-202
            task_id: task-dev-202
            capability: query.asset@v1
            arguments: {device: 123}        # int，schema 声明 string
            idempotency_key: idem-202
    expect:
      results:
        r1: {status: REJECTED, error_code: SCHEMA_INVALID, error_contains: arguments.device}
      event_types_absent:
        task-dev-202: [action.requested, action.executing]

  # ================= SPEC-M3-03 注册粒度与数据权威装配（D-27）=================
  - id: EVAL-M3-03-P
    spec: SPEC-M3-03
    title: CI 断言注册表 vs 本体动作表 diff 为空（16 个动作全部独立注册）
    form: negative_rejection
    executor: m3.registry
    params: {actions_table: ontology/actions.yaml}
    expect: {action_count: 16, diff_empty: true, split_registration: true}

  - id: EVAL-M3-03-P2
    spec: SPEC-M3-03
    title: 不可改清单双重表达一致 + 生命周期迁移表与冻结表 diff 为空（DoD）
    form: negative_rejection
    executor: m3.registry
    params: {actions_table: ontology/actions.yaml}
    expect:
      action_count: 16
      diff_empty: true
      immutable_consistent: true
      immutable_deny: [bypass.approval, modify.asset_history, modify.protection_setting]
      lifecycle_table_matches_fixture: true

  # ================= SPEC-M3-04 三值判定与判定事件 =================
  - id: EVAL-M3-04-P
    spec: SPEC-M3-04
    title: create.work_order（值班员）→ ALLOW + 判定事件 + 执行链
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-401
            task_id: task-dev-401
            capability: create.work_order@v1
            purpose: TX-01 重过载告警消缺
            arguments: {code: WO-0915-001, type: 消缺, related_alarm: AL-0001, description: 值班员创建消缺工单}
            risk: {level: MEDIUM, reversible: true}
            idempotency_key: idem-401
    expect:
      results: {r1: {action_id: act-401, status: SUCCEEDED, error_code: null}}
      decisions: {r1: ALLOW}
      event_seqs:
        task-dev-401: [action.requested, action.policy_decided, action.executing, action.completed]

  - id: EVAL-M3-04-P2
    spec: SPEC-M3-04
    title: execute.remote_control（任何角色）→ ASK→WAITING_APPROVAL+approval.requested
    form: expression
    executor: m3.execute
    params:
      env:
        park_instance: seed
        clock_start: 2026-09-15T08:00:00Z
        switch_orders:
          SO-0915-001: {status: ISSUED, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-402
            task_id: task-dev-402
            capability: execute.remote_control@v1
            purpose: 值班员指令：切除 2 号变压器这一路
            arguments: {device: SG-A02, operation: OPEN, switch_order: SO-0915-001}
            risk: {level: HIGH, reversible: false}
            idempotency_key: idem-402
    expect:
      results: {r1: {status: WAITING_APPROVAL}}
      decisions: {r1: ASK}
      event_seqs:
        task-dev-402: [action.requested, action.policy_decided, action.waiting_approval, approval.requested]
      event_types_absent:
        task-dev-402: [action.executing, action.completed]

  # ================= SPEC-M3-05 红线不可改清单（policy_locked，D-25）=================
  - id: EVAL-M3-04-N
    spec: SPEC-M3-04
    title: 动作不在授权规则表内（运行期注册能力，自声明 ALLOW）→ 第二道防线仍按 DENY 处置 → DENIED/POLICY_DENIED（红线 1）
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway: {evaluation: true}
      register:
        - capability_id: query.adhoc_telemetry@v1
          action_id: query.adhoc_telemetry
          version: v1
          name_cn: 临时遥测查询（未入 00§1.3 动作表）
          risk_level: LOW
          reversible: false
          default_policy: ALLOW          # 自声明 ALLOW——不在 ontology/actions.yaml，判定必须仍 DENY
          policy_locked: false
          params_schema: {type: object, required: [point], properties: {point: {type: string}}}
          disclosed_roles: []            # 空 = 对全部角色披露（越过注册/披露段，直达判定防线）
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-403
            task_id: task-dev-403
            capability: query.adhoc_telemetry@v1
            purpose: 运行期注册动作不在授权规则表——第二道防线必须 DENY（policy_engine.decide 未知动作分支）
            arguments: {point: TX-01.p_kw}
            idempotency_key: idem-403
    expect:
      results: {r1: {status: DENIED, error_code: POLICY_DENIED}}
      decisions: {r1: DENY}
      event_seqs:
        task-dev-403: [action.requested, action.policy_decided, action.completed]
      event_types_absent:
        task-dev-403: [action.executing]

  - id: EVAL-M3-05-N
    spec: SPEC-M3-05
    title: 超管角色请求 modify.protection_setting → DENY（锁定）→ DENIED/POLICY_DENIED（亦证 04 条 DENIED 终态）
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway:
        evaluation: true
        actor_roles: {OP-001: 超级管理员}   # 自造最高权限角色——不可改清单对任何角色生效
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-501
            task_id: task-dev-501
            capability: modify.protection_setting@v1
            purpose: 超管尝试修改保护定值
            arguments: {device: SG-A01, setting: {overcurrent_a: 800}}
            risk: {level: CRITICAL, reversible: false}
            idempotency_key: idem-501
    expect:
      results: {r1: {status: DENIED, error_code: POLICY_DENIED}}
      decisions: {r1: DENY}
      event_seqs:
        task-dev-501: [action.requested, action.policy_decided, action.completed]
      event_payloads:
        - {stream: task-dev-501, type: action.policy_decided, contains: {decision: DENY, locked: true}}

  - id: EVAL-M3-05-N2
    spec: SPEC-M3-05
    title: 审批人批准后请求把 remote_control 改为永久 ALLOW → 覆盖拒绝（override_rejected，锁定动作含收紧方向一切拒绝）
    form: expression
    executor: m3.execute
    params:
      env:
        park_instance: seed
        clock_start: 2026-09-15T08:00:00Z
        switch_orders:
          SO-0915-002: {status: ISSUED, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-502
            task_id: task-dev-502
            capability: execute.remote_control@v1
            purpose: 审批链上的遥控请求
            arguments: {device: SG-A02, operation: OPEN, switch_order: SO-0915-002}
            risk: {level: HIGH, reversible: false}
            idempotency_key: idem-502
        - id: a1
          op: approve
          action_id: act-502
          decision: GRANT
          approver: OP-004
          now: 2026-09-15T08:01:00Z
        - id: o1
          op: override
          role: 审批人
          capability: execute.remote_control
          decision: ALLOW       # 审批人企图把缺省 ASK 永久改为 ALLOW
    expect:
      results:
        r1: {status: WAITING_APPROVAL}
        a1: {status: SUCCEEDED}
      overrides: {o1: {accepted: false, effective: ASK}}
      event_payloads:
        - {type: action.policy_decided, contains: {override_rejected: true, decision: ASK}}

  - id: EVAL-M3-05-N3
    spec: SPEC-M3-05
    title: GRANT 只放行单次——放行后缺省仍 ASK，再次请求重回 WAITING_APPROVAL
    form: expression
    executor: m3.execute
    params:
      env:
        park_instance: seed
        clock_start: 2026-09-15T08:00:00Z
        switch_orders:
          SO-0915-003: {status: ISSUED, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
      gateway: {evaluation: true}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-503
            task_id: task-dev-503
            capability: execute.remote_control@v1
            purpose: 第一次遥控（将获批准）
            arguments: {device: SG-A02, operation: OPEN, switch_order: SO-0915-003}
            risk: {level: HIGH, reversible: false}
            idempotency_key: idem-503
        - id: a1
          op: approve
          action_id: act-503
          decision: GRANT
          approver: OP-004
          now: 2026-09-15T08:01:00Z
        - id: r2
          op: request
          now: 2026-09-15T08:02:00Z
          request:
            <<: *query_req
            action_id: act-504
            task_id: task-dev-503
            turn: 2
            capability: execute.remote_control@v1
            purpose: 第二次遥控（缺省未被批准改写，应再走审批）
            arguments: {device: SG-A02, operation: OPEN, switch_order: SO-0915-003}
            risk: {level: HIGH, reversible: false}
            idempotency_key: idem-504
    expect:
      results:
        a1: {status: SUCCEEDED}
        r2: {status: WAITING_APPROVAL}
      decisions: {r2: ASK}

  # ================= SPEC-M3-06 角色覆盖单向收紧（基准=当前生效判定，D-26）=================
  - id: EVAL-M3-06-P
    spec: SPEC-M3-06
    title: 值班员对 create.work_order 配收紧为 ASK 生效；放宽回缺省 ALLOW 同属放宽被拒（基准=当前生效判定）
    form: expression
    executor: m3.execute
    params:
      env: {park_instance: seed, clock_start: 2026-09-15T08:00:00Z}
      gateway:
        evaluation: true
        role_overrides: {值班员: {create.work_order: ASK}}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-601
            task_id: task-dev-601
            capability: create.work_order@v1
            purpose: 值班员工单（已被角色覆盖收紧为 ASK）
            arguments: {code: WO-0915-601, type: 检修}
            risk: {level: MEDIUM, reversible: true}
            idempotency_key: idem-601
        - id: o1
          op: override
          role: 值班员
          capability: create.work_order
          decision: ALLOW        # 放宽回缺省——基准=当前生效判定（ASK），必须被拒
        - id: r2
          op: request
          now: 2026-09-15T08:02:00Z
          request:
            <<: *query_req
            action_id: act-602
            task_id: task-dev-601
            turn: 2
            capability: create.work_order@v1
            purpose: 放宽尝试后的复验请求（仍应为 ASK）
            arguments: {code: WO-0915-602, type: 检修}
            risk: {level: MEDIUM, reversible: true}
            idempotency_key: idem-602
    expect:
      results:
        r1: {status: WAITING_APPROVAL}
        r2: {status: WAITING_APPROVAL}
      decisions: {r1: ASK, r2: ASK}
      overrides: {o1: {accepted: false, effective: ASK}}
      event_payloads:
        - {type: action.policy_decided, contains: {override_applied: true, decision: ASK}}

  # ================= SPEC-M3-07 审批队列：持久化与超时（D-28 审批半）=================
  - id: EVAL-M3-07-P
    spec: SPEC-M3-07
    title: 审批 301s 无响应 → REJECTED/APPROVAL_TIMEOUT（payload.timeout）+ approval.timeout 事件 + journal 终态回写
    form: expression
    executor: m3.execute
    params:
      env:
        park_instance: seed
        clock_start: 2026-09-15T08:00:00Z
        switch_orders:
          SO-0915-004: {status: ISSUED, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
      gateway: {evaluation: true, approval_timeout_s: 300}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-701
            task_id: task-dev-701
            capability: execute.remote_control@v1
            purpose: 无人响应的遥控请求
            arguments: {device: SG-A02, operation: OPEN, switch_order: SO-0915-004}
            risk: {level: HIGH, reversible: false}
            idempotency_key: idem-701
        - id: e1
          op: expire
          now: 2026-09-15T08:05:01Z   # 301s > 300s
    expect:
      results:
        r1: {status: WAITING_APPROVAL}
        e1: {status: REJECTED, error_code: APPROVAL_TIMEOUT}
      event_seqs:
        task-dev-701: [action.requested, action.policy_decided, action.waiting_approval, approval.requested, approval.timeout, action.completed]
      event_payloads:
        - {stream: task-dev-701, type: approval.timeout, contains: {timeout: true}}
        - {stream: task-dev-701, type: action.completed, contains: {status: REJECTED, timeout: true}}

  - id: EVAL-M3-07-P2
    spec: SPEC-M3-07
    title: approvals.jsonl 持久化——重启重放重建 pending，WAITING_APPROVAL 不丢、GRANT 续执行（DoD）
    form: expression
    executor: m3.execute
    params:
      env:
        park_instance: seed
        clock_start: 2026-09-15T08:00:00Z
        switch_orders:
          SO-0915-005: {status: ISSUED, steps: ["断开 SG-A02"], devices: [SG-A02], issuer: OP-003}
      gateway: {evaluation: true, approval_timeout_s: 300}
      steps:
        - id: r1
          op: request
          now: 2026-09-15T08:00:00Z
          request:
            <<: *query_req
            action_id: act-702
            task_id: task-dev-702
            capability: execute.remote_control@v1
            purpose: 重启前的遥控请求
            arguments: {device: SG-A02, operation: OPEN, switch_order: SO-0915-005}
            risk: {level: HIGH, reversible: false}
            idempotency_key: idem-702
        - {op: restart}               # 网关重启：从同一 sandbox 重放审批日志
        - id: a1
          op: approve
          action_id: act-702
          decision: GRANT
          approver: OP-004
          now: 2026-09-15T08:03:00Z
    expect:
      results:
        r1: {status: WAITING_APPROVAL}
        a1: {status: SUCCEEDED}
      event_seqs:
        task-dev-702: [action.requested, action.policy_decided, action.waiting_approval, approval.requested, approval.granted, action.executing, action.completed]

