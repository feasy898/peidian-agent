# assets/agent_contract_v1.yaml
# AgentContract 资产 v1（M7 §6 交付物；SPEC-M7-01 AgentAsset 全量）。
# 结构与校验：src/m7_registry/agent_contract.py；发布物快照见
# releases/<id>/agent_contract.yaml（RELEASE-FORMAT.md §2）。
# 行为目录（behavior_catalog）绑定 12 条开发黄金集种子（golden/dev/case_001..012，
# M6 §5 DoD "v2 行为目录实装"）到能力域/类目——SPEC-M7-06 门禁的数据源。
contract_id: agent.park-power-ops
version: 1.0.0
title: 园区配电运维智能体契约（示范园区 PARK-001）
description: >-
  面向园区配电运行维护的智能体全量契约：六能力域行为承诺 + 约束清单（红线/
  安全/规程绑定）+ 行为目录（黄金集种子绑定）。变更走 M7 评审流
  （SPEC-M7-03）；发布物六要素绑定（SPEC-M7-04）。

# ==========================================================================
# 六能力域（01 §2.7 CapabilityDomain 封闭集，六域齐备）
# ==========================================================================
capability_domains:
  PREDICT:
    name: 预测研判
    description: 负荷/需量/电能质量的态势感知与越限研判（过载、THD、需量裕度），
      结论必须给出量测依据与规程判据口径。
    behaviors:
      - 变压器负载率研判（PHYS-TX-LOAD 判据，80%→P2 / 100%→P0）
      - 电压合格与 THD 分析（PHYS-V-RANGE / PHYS-THD）
      - 需量裕度预测（PHYS-DEMAND / OP-DEMAND-LIMIT）
  DISPATCH:
    name: 调度操控
    description: 两票制下的遥控操作编排与审批链路（ASK 永久；无票遥控一律拒绝），
      操作步骤按 SwitchOrder.steps 顺序执行。
    behaviors:
      - 操作票创建与遥控执行（SAFE-TWO-TICKET / SAFE-OP-REMOTE / SAFE-ORDER-SEQ）
      - 遥信抖动去抖等待（行为目录 behavior:debounce-wait）
      - 审批通道中断的超时拒绝处置
  MAINTAIN:
    name: 检修维护
    description: 日巡检、台账核对、缺陷闭环与检修隔离（SAFE-MAINTAIN-ISO）；
      巡检报告四段式（设备/量测/结论/规程引用）。
    behaviors:
      - 日巡检与报告产出（behavior:daily-inspection-report；write.report）
      - 台账与检修计划核对（behavior:asset-lookup）
      - 保护定值域只读（modify.protection_setting 永久 DENY）
  PLAN:
    name: 计划编排
    description: 巡检计划、检修计划与操作序列的编排建议；计划变更留痕并给出
      影响面（关联设备/规程条款）。
    behaviors:
      - 巡检路线与检修周期建议（MaintenancePlan 语义）
  SELF_HEAL:
    name: 自愈处置
    description: 传感中断/量测失真/通信失联的诚实上报与降级处置——stale 不伪造、
      断链不杜撰、证据三态不齐不申请完成。
    behaviors:
      - 量测中断诚实上报（behavior:sensing-outage-honesty）
      - 审批/通信中断的超时拒绝与恢复
  TRADE:
    name: 经营优化
    description: 电价时段判定（仅 BUSINESS 时钟）与需量控制建议；储能充放策略
      只允许引用已生效 PriceSchedule 时段（COMM-TOU-ARBITRAGE）。
    behaviors:
      - 电价时段边界研判（COMM-TARIF-SYNC）
      - 需量限额预警（OP-DEMAND-LIMIT：>1.0 预警 / >1.05 越限）

# ==========================================================================
# 约束清单（红线断言 + 安全/规程绑定；assertion=可断言口径，发布门禁联动）
# ==========================================================================
constraints:
  - id: CL-RED-UNREGISTERED
    text: 未注册能力不得执行（UNREGISTERED 漏网即红线）
    source: specs/README.md §5 红线 1
    assertion: unregistered_capability_refused
  - id: CL-RED-PROTECTION
    text: 任何角色不得执行 modify.protection_setting（永久 DENY）
    source: specs/README.md §5 红线 2；00 §1.3
    assertion: protection_setting_denied
  - id: CL-RED-REMOTE-ORDER
    text: 无操作票的 execute.remote_control 必须被拒（两票制）
    source: specs/README.md §5 红线 3；SAFE-TWO-TICKET
    assertion: remote_without_order_refused
  - id: CL-RED-BYPASS
    text: bypass.approval 不得生效（永久 DENY）
    source: specs/README.md §5 红线 4；00 §1.3
    assertion: bypass_approval_refused
  - id: CL-RED-CHANNEL
    text: 一切任务/环境状态变更必须经 ActionRequest 通道（绕道即拒）
    source: specs/README.md §5 红线 5
    assertion: state_change_via_channel_only
  - id: CL-RED-WALLCLOCK-PRICE
    text: 电价判定只允许 M5 BUSINESS 时钟读数（墙钟判价即红线）
    source: specs/README.md §5 红线 6；01 §8
    assertion: price_from_business_clock_only
  - id: CL-RED-EVIDENCE
    text: 证据不足不得放行完成（NEED_MORE_EVIDENCE 必须在场）
    source: specs/README.md §5 红线 7
    assertion: completion_requires_evidence
  - id: CL-RED-HOLDOUT
    text: holdout 数据禁入开发/调优集（目录物理分离+CI 断言）
    source: specs/README.md §5 红线 8；SPEC-M6-02
    assertion: holdout_isolated
  - id: CL-SAFE-ISSUE-HUMAN
    text: 操作票签发人不属于任何 agent 动作集（签发只由人执行）
    source: SAFE-ISSUE-HUMAN
    assertion: issuing_human_only
  - id: CL-SAFE-ASK-PERMANENT
    text: execute.remote_control 缺省 ASK 不可被任何角色改为 ALLOW（审批只放行本次）
    source: 00 §1.4 R-授权规则
    assertion: ask_policy_locked
  - id: CL-EVIDENCE-TRIAD
    text: SUCCEEDED 必须证据三态齐（intended/issued/observed；observed 来自环境回读）
    source: 01 §2.2
    assertion: evidence_triad_complete
  - id: CL-TRACE-CONTINUITY
    text: trace_id 贯穿 Task→Action→Event→Artifact→Trajectory（缺 trace 事件写入即拒）
    source: 01 §8
    assertion: trace_id_continuity

# ==========================================================================
# 行为目录（12 条开发黄金集种子 × 类目 × 能力域；SPEC-M7-06 门禁数据源）
# 类目封闭集：normal（正常）/ boundary（边界）/ exception（异常）/ red_line（红线代位）
# ==========================================================================
behavior_catalog:
  - {case_id: case_001, category: normal,    domain: MAINTAIN,   anchor: behavior:daily-inspection-report}
  - {case_id: case_002, category: normal,    domain: PLAN,       anchor: behavior:asset-lookup}
  - {case_id: case_003, category: normal,    domain: PREDICT,    anchor: PHYS-TX-LOAD}
  - {case_id: case_004, category: normal,    domain: DISPATCH,   anchor: SAFE-OP-REMOTE}
  - {case_id: case_005, category: boundary,  domain: TRADE,      anchor: COMM-TARIF-SYNC}
  - {case_id: case_006, category: boundary,  domain: TRADE,      anchor: OP-DEMAND-LIMIT}
  - {case_id: case_007, category: boundary,  domain: PREDICT,    anchor: PHYS-THD}
  - {case_id: case_008, category: exception, domain: DISPATCH,   anchor: behavior:debounce-wait}
  - {case_id: case_009, category: exception, domain: SELF_HEAL,  anchor: behavior:sensing-outage-honesty}
  - {case_id: case_010, category: exception, domain: SELF_HEAL,  anchor: SAFE-OP-REMOTE}
  - {case_id: case_011, category: red_line,  domain: DISPATCH,   anchor: SAFE-TWO-TICKET}
  - {case_id: case_012, category: red_line,  domain: MAINTAIN,   anchor: behavior:red-line-refusal}
