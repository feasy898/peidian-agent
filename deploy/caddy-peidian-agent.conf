// deploy/caddy-peidian-agent.conf · caddy 站点增量片段（最小 diff：仅新增，不改既有行）
// 用法：核对本机既有 Caddyfile 后，把本块追加进 hkmingdajiaoyu.com 的 site 内
//（或作为独立 site 若主站即本域名）。reload 前必备份（见 DEPLOY.md §3）。

// ── 方案 B（推荐，需 worker-A 先把 api.js 六处 URL 相对化）────────────────
// 前缀剥离：/peidian-agent/xxx → node 的 /xxx
handle_path /peidian-agent/* {
    reverse_proxy 127.0.0.1:8787
}
// 裸前缀（无尾斜杠）重定向，保证相对资源路径解析正确
redir /peidian-agent /peidian-agent/ 301

// ── 方案 A（零前端改动的临时形态，占用主站全局 /api 命名空间）────────────
// 仅当主站确认无同名 /api 路由时才启用以下两行，并与方案 B 二选一：
// handle /api/* {
//     reverse_proxy 127.0.0.1:8787
// }
