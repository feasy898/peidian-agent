# skills/emergency-grading/SKILL.yaml · SkillAsset 0.1.0（01 §2.7 SkillDescriptor 形状）
# 来源：2026-09-30 汇报前夜观众需求——「应急预警的分级分类：什么情况启动哪个级别的
# 应急、哪个级别对应哪些岗位哪些操作」，作为 Q&A 弹药做成可演示技能雏形。
# 本文件 = 技能描述子（上半）+ 数据驱动映射表（emergency_grading 节，下半）。
# grade.py 是确定性执行器：只读本文件的映射表，零硬编码判级逻辑——
# 整表替换为园区备案应急预案后，无需改一行代码。
skill_id: skill.emergency-grading
version: 0.1.0
capability_domain: PREDICT
disclosure:
  level0: 应急预警分级分类
  level1: 告警/事件特征 → 应急级别（Ⅰ/Ⅱ/Ⅲ/Ⅳ）→ 响应时限 → 岗位与操作清单，
    确定性判定（grade.py 只读映射表，未知事件一律上报人工判定、不猜级）。
  level2_ref: skills/emergency-grading/SKILL.md
entry:
  prompt_ref: null  # 本技能为确定性脚本通道（grade.py），不走 LLM 判级；prompt 位留空
  checklist: 应急分级清单（特征匹配/最高级合并/时限与四岗位/升级解除条件/未知上报人工）
evidence_policy: 输出必须附触发依据（告警 ID × 映射条款 rule_id）与映射表版本号；
  未知事件类型不得给级别猜测，只能进入 manual_review（上报人工判定）。
owner: m9-emergency-grading
status: DRAFT
dependencies: []  # 自包含：映射数据 + 确定性脚本，不依赖 prompts/tools 资产

# ===========================================================================
# 应急分级映射表（数据驱动核心；grade.py 唯一数据源）
# ===========================================================================
emergency_grading:
  mapping_id: emergency-grading@demo-2026-09-30
  basis_note: >-
    示范规则（非园区备案预案）：级别-时限骨架按系统告警级别 P0-P3 的响应语义
    （src/contracts/enums.py:50-55，AlarmLevel：P0=紧急 5min / P1=重要 30min /
    P2=一般 4h / P3=提示 24h）与园区配电运维通行惯例构造；岗位动作按《电业安全
    工作规程》两票与调度惯例示范。可整表替换为园区备案应急预案（保留字段形状即可），
    替换后 grade.py 零代码改动。
  level_semantics_note: >-
    Ⅰ=特别重大（已跳闸/失电/火灾，需 5min 内响应）；Ⅱ=重大（重过载可转供未失电、
    通信全中断失去监视）；Ⅲ=较大（直流接地/水浸等缺陷性事件）；Ⅳ=一般（预警/提示，
    预防性响应）。多告警并发时取最高级（severity rank 最小者）。

  # 系统告警级别 P0-P3 → 应急级别合理映射区间（示范规则；逐事件在区间内定档）
  priority_map:
    P0: ["Ⅰ", "Ⅱ"]   # 紧急 5min：已跳闸/失压/火灾→Ⅰ；重过载可转供缓解→Ⅱ
    P1: ["Ⅱ", "Ⅲ"]   # 重要 30min：通信全中断失去监视→Ⅱ；直流接地/水浸→Ⅲ
    P2: ["Ⅲ", "Ⅳ"]   # 一般 4h：台风暴雨预警、轻瓦斯→Ⅳ（预防性）
    P3: ["Ⅳ"]          # 提示 24h：提示类全部落一般档

  # 应急级别定义（rank 越小越严重；response_minutes=该级缺省响应时限）
  levels:
    "Ⅰ":
      rank: 1
      name: 特别重大应急
      response_minutes: 5
    "Ⅱ":
      rank: 2
      name: 重大应急
      response_minutes: 15
    "Ⅲ":
      rank: 3
      name: 较大应急
      response_minutes: 30
    "Ⅳ":
      rank: 4
      name: 一般应急（预警/提示）
      response_minutes: 120

  # 岗位固定输出顺序（合并多规则操作时按此序）
  posts_order: [值班员, 调度员, 签发人, 审批人]

  # 未知事件兜底（不猜级）：全部数据驱动
  manual_fallback:
    action: 上报人工判定
    reason_template: "事件类型 {type}（告警 {id}）未登记于应急分级映射表，系统不猜测级别"
    posts:
      值班员:
        - 立即上报值班长/安全员人工判定应急级别，未经人工判定不得执行处置动作
    escalate_note_template: "存在未登记事件类型（{ids}），级别判定权移交人工，人工可按园区预案直接定级"

  # 映射规则：告警/事件特征 → 级别/时限/岗位操作/升降级条件
  # event_types 为机器码（对齐系统事件命名风格 task.created 的点分小写惯例，
  # 走 alarm.raised / grid.event 载荷的特征字段）；全网唯一，无二义匹配。
  rules:
    # ---- Ⅰ 级（P0，5min）------------------------------------------------
    - rule_id: EMG-R01
      feature: 变压器重瓦斯动作跳闸（注入事件近似：气体继电器重瓦斯信号+保护出口跳闸）
      event_types: [prot.gas_heavy_trip]
      level: "Ⅰ"
      p_priority: P0
      time_limit_minutes: 5
      posts:
        值班员:
          - 确认气体继电器重瓦斯信号与保护动作报文，记录 SOE 事件时序
          - 复归音响但保持保护信号（不得复归掉牌），立即向调度员与值班长双报告
          - 调阅故障录波，初判故障相别与短路电流
        调度员:
          - 核实变压器两侧断路器确已断开，故障变压器已隔离
          - 将负荷倒至健全变压器/母线（先备后停），控制停电范围最小化
          - 通知检修班组现场取气样判明故障性质；重瓦斯动作禁止试送电
        签发人:
          - 按事故紧急处置条款许可先隔离后处置，24h 内补办操作票
          - 系统内遥控操作仍须已签发操作票步骤（SAFE-TWO-TICKET 口径），不豁免
        审批人:
          - 涉及远方遥控隔离的按 ASK 链路即时审批，紧急时当值调度长可代行并事后追认
      escalate_when:
        - 取气样判明内部故障（可燃气体超标）→ 维持 Ⅰ 并上报公司应急办
        - 同母线另一台主变同时异常 → 按全站失电风险升级处置
      release_when:
        - 故障变压器转检修、负荷全部转出且系统稳定运行 30min → 降为 Ⅲ 消缺跟踪

    - rule_id: EMG-R02
      feature: 变压器差动保护动作跳闸（注入事件近似：差动电流越限+保护出口跳闸）
      event_types: [prot.diff_trip]
      level: "Ⅰ"
      p_priority: P0
      time_limit_minutes: 5
      posts:
        值班员:
          - 确认差动保护动作报文与差动电流记录，记录 SOE 事件时序
          - 复归音响但保持保护信号，立即向调度员与值班长双报告
          - 就地检查变压器本体、套管、引线有无明显故障点
        调度员:
          - 核实变压器两侧断路器确已断开，故障变压器已隔离
          - 将负荷倒至健全变压器/母线（先备后停）
          - 差动保护区故障未查明前禁止试送电
        签发人:
          - 按事故紧急处置条款许可先隔离后处置，24h 内补办操作票
          - 系统内遥控操作仍须已签发操作票步骤（SAFE-TWO-TICKET 口径），不豁免
        审批人:
          - 涉及远方遥控隔离的按 ASK 链路即时审批，紧急时当值调度长可代行并事后追认
      escalate_when:
        - 检查发现本体明显故障（喷油/着火迹象）→ 并入火灾或重瓦斯流程维持 Ⅰ
        - 倒负荷后健全变压器负载率越限 → 并入重过载规则联合处置
      release_when:
        - 故障点查明并隔离、负荷转出且稳定运行 30min → 降为 Ⅲ 消缺跟踪

    - rule_id: EMG-R03
      feature: 母线失压（母线电压遥测归零+进线开关变位）
      event_types: [bus.undervoltage]
      level: "Ⅰ"
      p_priority: P0
      time_limit_minutes: 5
      posts:
        值班员:
          - 确认母线电压遥测、进线开关位置与保护动作情况，记录失压范围
          - 立即向调度员与值班长报告，通知失压母线所带重要用户
        调度员:
          - 判定失压范围与故障母线，隔离故障段
          - 按失压拉路序位恢复送电，先保安电源后重要负荷
          - 全站失电时启动黑启动/保安电源预案
        签发人:
          - 恢复送电操作票按紧急流程优先签发
          - 系统内遥控操作仍须已签发操作票步骤（SAFE-TWO-TICKET 口径），不豁免
        审批人:
          - 恢复送电序列中遥控操作按 ASK 链路即时审批
      escalate_when:
        - 恢复过程中故障重复出现 → 维持 Ⅰ 并请求上级调度支援
        - 失压影响重要用户（医院/数据中心类）双回路全停 → 上报政府主管部门
      release_when:
        - 母线恢复送电、电压正常且重要负荷全部恢复 → 降为 Ⅲ 消缺跟踪

    - rule_id: EMG-R04
      feature: 配电室/变压器火灾（确认，非误报）
      event_types: [fire.confirmed]
      level: "Ⅰ"
      p_priority: P0
      time_limit_minutes: 5
      posts:
        值班员:
          - 立即拨打 119 并向调度员与值班长报告，启动气体灭火/水消防
          - 断开着火区域电源（就地/遥控），组织无关人员撤离
          - 正压消防/排风系统投运确认，火灾区域门口警戒
        调度员:
          - 隔离着火配电装置电源，确认撤离通道与应急照明供电
          - 火势影响相邻母线时预先转移负荷
        签发人:
          - 火灾扑灭后抢修工作票优先签发（先隔离火场电源后补办）
          - 系统内遥控操作仍须已签发操作票步骤（SAFE-TWO-TICKET 口径），不豁免
        审批人:
          - 灭火与抢修涉及断电范围扩大的按 ASK 链路即时审批
      escalate_when:
        - 火势蔓延至相邻配电间隔或充油设备 → 维持 Ⅰ 并请求专业消防增援
        - 伴生全站失压 → 并入母线失压规则联合处置
      release_when:
        - 明火扑灭、隐患排除且设备状态确认 → 降为 Ⅲ 抢修跟踪

    # ---- Ⅱ 级（P0/P1，15min）---------------------------------------------
    - rule_id: EMG-R05
      feature: 变压器重过载（负载率 >100%，PHYS-TX-LOAD 判据口径 P0 档）
      event_types: [tx.severe_overload]
      level: "Ⅱ"
      p_priority: P0
      time_limit_minutes: 15
      posts:
        值班员:
          - 每 5min 记录负载率与顶层油温，投入全部冷却器（风扇/油泵）
          - 向调度员报告过载幅度与持续时间
        调度员:
          - 按可转供路径转移负荷（母线/变压器间），压降园区可中断负荷
          - 转供不足时按序拉路限电，保障保安电源与重要用户
        签发人:
          - 转供与拉路的遥控操作票即时签发（步骤按票面顺序）
        审批人:
          - 拉路限电名单按 ASK 链路审批（涉及重要用户时逐户确认）
      escalate_when:
        - 负载率 >120% 或油温 >95℃ 持续 15min → 升 Ⅰ
        - 冷却器全投后油温仍上升 → 升 Ⅰ 并准备停运变压器
      release_when:
        - 负载率回落 ≤80% 且油温连续 30min 回落 → 解除，转 Ⅳ 跟踪

    - rule_id: EMG-R06
      feature: 通信全中断（调度数据网+行政电话双通道全断，失去遥测遥控）
      event_types: [comm.total_blackout]
      level: "Ⅱ"
      p_priority: P1
      time_limit_minutes: 15
      posts:
        值班员:
          - 立即启用备用通信（公网电话/对讲机）向调度报告并保持定时联络
          - 转人工监视：就地抄录关键表计与信号，每 15min 一轮
        调度员:
          - 中断期间冻结依赖遥测的远方遥控操作，改就地操作+电话指令
          - 通知通信检修班组抢修，评估中断期间电网风险
        签发人:
          - 中断期间操作票签发改为电话录音+纸质补登
        审批人:
          - 中断期间新增遥控申请一律建议改就地执行，恢复后再受理远方遥控
      escalate_when:
        - 中断持续 >30min 或叠加大风雷雨工况 → 升 Ⅰ（失去监视+恶劣天气叠加）
      release_when:
        - 双通道恢复且遥测数据一致性核对完成 → 解除

    # ---- Ⅲ 级（P1，30min）------------------------------------------------
    - rule_id: EMG-R07
      feature: 直流系统接地（绝缘监察告警，正/负母线对地电压异常）
      event_types: [dc.ground_fault]
      level: "Ⅲ"
      p_priority: P1
      time_limit_minutes: 30
      posts:
        值班员:
          - 记录绝缘监察装置读数与正/负母线对地电压，报告调度员
          - 回顾接地前操作与天气情况，初判可能支路
        调度员:
          - 按拉路瞬停法寻找接地支路（先信号/照明回路后操作回路）
          - 通知继保班组带电查找，避免造成直流短路或保护误动
        签发人:
          - 查找接地的拉路操作按操作票或调度指令执行
        审批人:
          - 涉及保护屏工作的按 ASK 链路审批（防误碰运行设备）
      escalate_when:
        - 同一极出现第二点接地风险或直流母线电压异常 → 升 Ⅱ（两点接地可致保护误动拒动）
      release_when:
        - 接地消除、绝缘监察恢复正常 → 解除，转缺陷跟踪

    - rule_id: EMG-R08
      feature: 电缆沟水浸（水位传感器越限/巡检确认）
      event_types: [cable_trench.flooding]
      level: "Ⅲ"
      p_priority: P1
      time_limit_minutes: 30
      posts:
        值班员:
          - 确认水位读数与排水泵自动启动情况，现场拍照留证
          - 向调度员报告水位上涨速率
        调度员:
          - 评估水位与带电设备安全距离，必要时申请局部停电
          - 通知运维班组架设临时排水泵
        签发人:
          - 排水与停电抢修工作票优先签发
        审批人:
          - 涉及停电范围的按 ASK 链路审批
      escalate_when:
        - 水位接近电缆终端头或配电柜基础 → 升 Ⅱ
        - 伴随暴雨红色预警 → 并入台风暴雨规则联合响应
      release_when:
        - 水位回落至警戒线以下且排水正常 → 解除，转缺陷跟踪

    # ---- Ⅳ 级（P2，120min，预防性）----------------------------------------
    - rule_id: EMG-R09
      feature: 台风/暴雨气象预警（气象台发布，园区进入预防响应）
      event_types: [wx.typhoon_rainstorm_alert]
      level: "Ⅳ"
      p_priority: P2
      time_limit_minutes: 120
      posts:
        值班员:
          - 检查配电室门窗/屋顶/排水沟，清点防汛物资（沙袋/潜水泵/应急灯）
          - 加强巡视，低洼站房每 2h 巡视一次
        调度员:
          - 预置转供方式与保电方案，通知重要用户预备自备电源
          - 台风登陆前完成可推迟的检修停电恢复
        签发人:
          - 暂停预安排的停电检修计划审批（恶劣天气不作业）
        审批人:
          - 预防性加固与值守加班按 ASK 链路审批
      escalate_when:
        - 台风登陆或暴雨预警升为红色 → 升 Ⅲ（实体预防性响应）
        - 站房出现进水 → 并入电缆沟水浸规则
      release_when:
        - 预警解除且 24h 内无异常 → 解除，恢复正常值班模式

    - rule_id: EMG-R10
      feature: 变压器轻瓦斯告警（气体继电器积气，未跳闸）
      event_types: [tx.gas_light_alarm]
      level: "Ⅳ"
      p_priority: P2
      time_limit_minutes: 120
      posts:
        值班员:
          - 记录气体继电器积气量与产生速率，加强巡视（每 2h 一次）
          - 关注油温/油位变化，异常即报调度员
        调度员:
          - 安排检修班组取气分析，评估是否需要降负荷运行
        签发人:
          - 取气样工作票按带电作业要求签发
        审批人:
          - 需要降负荷或停电检查的按 ASK 链路审批
      escalate_when:
        - 积气速率突增或转重瓦斯信号 → 升 Ⅰ（并入 EMG-R01 流程）
        - 油色谱分析异常（乙炔超标）→ 升 Ⅲ 安排停电检查
      release_when:
        - 连续 48h 无新增气体且取气分析无异常 → 解除，转缺陷跟踪
